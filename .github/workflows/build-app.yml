name: Build Feather-Krita App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'windows/**'
      - 'android/**'
      - 'assets/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - 'native/krita_bridge/**'

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze (infos non-fatal)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Windows EXE (release)
        run: flutter build windows --release

      - name: Verify bundled DLL next to exe
        shell: pwsh
        run: |
          $exe = "build/windows/x64/runner/Release/feather_krita.exe"
          $dll = "build/windows/x64/runner/Release/krita_bridge.dll"
          if (-not (Test-Path $exe)) { Get-ChildItem build/windows/x64/runner/Release; Write-Error "exe missing"; exit 1 }
          if (-not (Test-Path $dll)) { Write-Error "krita_bridge.dll NOT bundled next to exe"; exit 1 }
          Write-Host "OK: exe + krita_bridge.dll present in Release output"

      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath feather-krita-windows.zip
          Get-Item feather-krita-windows.zip | Select-Object Name, Length

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: feather-krita-windows
          path: feather-krita-windows.zip
          retention-days: 30

  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # Regression suite added in loop-20. Serial because the GUI tests
      # allocate several 2048x2048 texture buffers each; parallel file
      # VMs on memory-limited runners can OOM (flaky "did not complete").
      - name: Run regression suite (serial)
        run: flutter test --concurrency=1

      - name: Build Android APK (release, debug-signed for direct install)
        run: flutter build apk --release

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk feather-krita-android.apk
          ls -la feather-krita-android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: feather-krita-android
          path: feather-krita-android.apk
          retention-days: 30


  build-windows-real-engine:
    # Windows desktop build bundling the REAL Krita engine (merged
    # krita_bridge_real.dll = bridge glue + 955 krita objects in ONE image,
    # MSVC x64, plus Qt5/KF5/vcpkg runtime DLLs), verified end-to-end via
    # the app's own Dart FFI bindings running on the Dart VM (loop-35,
    # roadmap b). Krita source: real v6.0.4, never modified.
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Find latest green krita-build run
        id: engine_run
        shell: bash
        run: |
          RID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/krita-build.yml/runs?status=success&per_page=1" \
            | python -c 'import sys,json;print(json.load(sys.stdin)["workflow_runs"][0]["id"])')
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
          echo "Latest green krita-build run: $RID"

      - name: Download real-engine artifact
        uses: actions/download-artifact@v4
        with:
          name: krita-brush-engine-windows
          run-id: ${{ steps.engine_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: krita-engine

      - name: Build Windows app (release)
        run: flutter build windows --release

      - name: Bundle real engine into Release dir
        shell: bash
        run: |
          REL=build/windows/x64/runner/Release
          # single merged engine DLL: rename to the name the app's FFI loader
          # expects (krita_bridge.dll), plus every runtime DLL next to the exe
          cp krita-engine/bin/krita_bridge_real.dll "$REL/krita_bridge.dll"
          cp krita-engine/bin/*.dll "$REL/"
          echo "Release dir: $(ls "$REL" | wc -l) files"
          ls "$REL" | head -12

      - name: Dart FFI end-to-end smoke (real engine, self-contained)
        shell: bash
        run: |
          export PATH="$(pwd)/build/windows/x64/runner/Release:$PATH"
          dart run tool/ffi_real_smoke.dart "$(pwd)/build/windows/x64/runner/Release"

      - name: Package Windows zip (real engine)
        shell: bash
        run: |
          cd build/windows/x64/runner/Release
          powershell -NoProfile -Command "Compress-Archive -Path * -DestinationPath feather-krita-windows-real-engine.zip -Force"
          ls -lh feather-krita-windows-real-engine.zip

      - name: Upload Windows build (real engine)
        uses: actions/upload-artifact@v4
        with:
          name: feather-krita-windows-real-engine
          path: build/windows/x64/runner/Release/feather-krita-windows-real-engine.zip
          retention-days: 30

  build-linux-real-engine:
    # Linux desktop build bundling the REAL Krita engine (libkrita_bridge.so
    # renamed from libkrita_bridge_real.so + real libkrita*.so from the
    # krita-build workflow), verified end-to-end via the app's own Dart FFI
    # bindings running on the Dart VM.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps (fatal)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev patchelf zip

      - name: Install Krita runtime deps (best effort, ldd audit + FFI smoke gate)
        run: |
          sudo apt-get install -y \
            libqt5core5a libqt5gui5 libqt5widgets5 libqt5xml5 libqt5svg5 libqt5sql5 libqt5printsupport5 \
            libkf5i18n5 libkf5configcore5 libkf5configgui5 libkf5archive5 libkf5guiaddons5 libkf5widgetsaddons5 libkf5coreaddons5 libkf5itemviews5 \
            libgsl27 libgslcblas0 liblcms2-2 libimath-3-1-29 libopenexr-3-1-30 \
            libexiv2-27 libjson-c5 libquazip1-qt5-1 libunibreak5 libxi6 libxrender1 libxext6 || \
            echo "WARNING: some Krita runtime packages missing - ldd audit will report"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Find latest green krita-build run
        id: engine_run
        run: |
          RID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/krita-build.yml/runs?status=success&per_page=1" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["workflow_runs"][0]["id"])')
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
          echo "Latest green krita-build run: $RID"

      - name: Download real-engine artifact
        uses: actions/download-artifact@v4
        with:
          name: krita-brush-engine
          run-id: ${{ steps.engine_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: krita-engine

      - name: Build Linux app (release)
        run: flutter build linux --release

      - name: Bundle real engine into app bundle
        run: |
          BUNDLE=build/linux/x64/release/bundle
          mkdir -p $BUNDLE/lib
          cp krita-engine/lib/libkrita*.so* $BUNDLE/lib/
          cp krita-engine/lib/libkrita_bridge_real.so $BUNDLE/lib/libkrita_bridge.so
          # Self-contained bundle (loop-34): every libkrita*.so resolves its
          # libkrita* siblings from $ORIGIN (bundle/lib). DT_RUNPATH set here
          # makes the shipped zip work WITHOUT LD_LIBRARY_PATH. System
          # Qt5/KF5 deps still come from the OS (documented runtime deps).
          patchelf --set-rpath '$ORIGIN' $BUNDLE/lib/libkrita*.so*
          # Runtime dependency audit (warn-only; the FFI smoke is the gate).
          for f in $BUNDLE/lib/libkrita*.so*; do
            LDD=$(ldd "$f" 2>/dev/null | grep "not found" || true)
            if [ -n "$LDD" ]; then
              echo "WARNING unresolved deps for $(basename $f):"
              echo "$LDD"
            fi
          done
          echo "bundle/lib: $(ls $BUNDLE/lib | wc -l) files"
          ls $BUNDLE/lib | head -20

      - name: Dart FFI end-to-end smoke (real engine, self-contained)
        run: |
          echo '=== unresolved-dep audit (expect OK) ==='
          ldd build/linux/x64/release/bundle/lib/libkrita_bridge.so 2>&1 | grep 'not found' \
            && { echo 'FAIL: unresolved deps above'; exit 1; } \
            || echo 'OK: no unresolved deps'
          echo '=== dart FFI smoke WITHOUT LD_LIBRARY_PATH (proves $ORIGIN self-containment) ==='
          env -u LD_LIBRARY_PATH dart run tool/ffi_real_smoke.dart "$(pwd)/build/linux/x64/release/bundle"

      - name: Package Linux zip
        run: |
          cd build/linux/x64/release
          zip -qr feather-krita-linux-real-engine.zip bundle
          ls -lh feather-krita-linux-real-engine.zip

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: feather-krita-linux-real-engine
          path: build/linux/x64/release/feather-krita-linux-real-engine.zip
          retention-days: 30

  build-android-real-engine:
    # Android build bundling the REAL Krita engine (merged libkrita_bridge.so
    # = bridge glue + 959 krita objects in ONE image, NDK arm64-v8a, plus
    # Qt5/KF5/icu runtime .so via jniLibs), loop-36 (roadmap c). The app's
    # Dart FFI loader opens 'libkrita_bridge.so' by name on Android, so the
    # real engine replaces the fallback bridge seamlessly. Krita source:
    # real v6.0.4, never modified.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Find latest green krita-build run
        id: engine_run
        run: |
          RID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/krita-build.yml/runs?status=success&per_page=1" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["workflow_runs"][0]["id"])')
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
          echo "Latest green krita-build run: $RID"

      - name: Download real-engine artifact (arm64-v8a)
        uses: actions/download-artifact@v4
        with:
          name: krita-brush-engine-android-arm64-v8a
          run-id: ${{ steps.engine_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: krita-engine

      - name: Bundle real engine into jniLibs (arm64-v8a)
        run: |
          JLIB=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$JLIB"
          cp krita-engine/lib/libkrita_bridge.so "$JLIB/"
          # runtime .so from the engine bundle (skip any x86_64-named strays)
          find krita-engine/android/arm64-v8a -name '*.so' ! -name '*x86_64*' \
            -exec cp {} "$JLIB/" \;
          ls -la "$JLIB" | head -40
          NB=$(ls "$JLIB" | wc -l)
          echo "jniLibs: $NB files"
          [ "$NB" -ge 5 ] || { echo 'FATAL: bundle too small'; exit 1; }

      - name: DT_NEEDED audit (every dependency present in jniLibs)
        run: |
          JLIB=android/app/src/main/jniLibs/arm64-v8a
          RE=$(find /usr/local/lib/android/sdk/ndk -name 'llvm-readelf' | sort | tail -1)
          NEEDS=$("$RE" -d "$JLIB/libkrita_bridge.so" | awk '/\(NEEDED\)/{print $NF}' | tr -d '[]')
          MISSING=0
          for n in $NEEDS; do
            if [ -f "$JLIB/$n" ]; then
              echo "  bundled: $n"
            else
              case "$n" in
                liblog.so|libz.so|libm.so|libdl.so|libc.so|libandroid.so)
                  echo "  system: $n" ;;
                *)
                  echo "  MISSING: $n"; MISSING=$((MISSING+1)) ;;
              esac
            fi
          done
          # libc++_shared.so must ship in the APK (Qt/KF5 DT_NEEDED it)
          test -f "$JLIB/libc++_shared.so" || {
            echo 'FATAL: libc++_shared.so not bundled (required by Qt/KF5 at load)';
            MISSING=$((MISSING+1));
          }
          [ "$MISSING" -eq 0 ] || { echo "FATAL: $MISSING missing libs"; exit 1; }
          # ---- indirect-UNDEF closure gate (loop-45): bionic resolves
          # UNDEFs ONLY along the DT_NEEDED load closure; a jniLibs .so
          # that is present but NOT reachable from libkrita_bridge.so
          # contributes nothing to symbol resolution (the exact v0.28
          # defect class: QuaZip via kritastore run 35509208740,
          # QPrinter/Qt5PrintSupport via kritawidgets run 35509902482).
          # BFS the NEEDED graph: every bundled lib must be reachable
          # from libkrita_bridge.so and every NEEDED entry must have a
          # jniLibs provider (or be a bionic system lib).
          JLIB="$JLIB" RE_BIN="$RE" python3 - << 'PYEOF'
          import os, re, subprocess, glob, sys
          d, re_bin = os.environ['JLIB'], os.environ['RE_BIN']
          rx = re.compile(r'Shared library: \[([^\]]+)\]')
          def needed(p):
              out = subprocess.run([re_bin, '-d', p], capture_output=True, text=True).stdout
              return rx.findall(out)
          # libEGL/libGLESv2/libjnigraphics = Android system libs (/system/lib64),
          # on-device resolution proven by the loop-43/44 green harness runs
          syslibs = {'liblog.so', 'libz.so', 'libm.so', 'libdl.so', 'libc.so', 'libandroid.so', 'libEGL.so', 'libGLESv2.so', 'libjnigraphics.so'}
          files = {os.path.basename(p) for p in glob.glob(os.path.join(d, '*.so'))}
          files.discard('libkrita_bridge.so')
          seen, stack = {'libkrita_bridge.so'}, ['libkrita_bridge.so']
          orphan_needed = set()
          while stack:
              cur = stack.pop()
              p = os.path.join(d, cur)
              if not os.path.exists(p):
                  if cur not in syslibs: orphan_needed.add(cur)
                  continue
              for n in needed(p):
                  if n not in seen:
                      seen.add(n); stack.append(n)
          unreached = sorted(files - seen)
          if unreached:
              print('FATAL: jniLibs present but NOT reachable in DT_NEEDED closure:', unreached)
              sys.exit(1)
          if orphan_needed:
              print('FATAL: NEEDED entries with no jniLibs provider and not system libs:', sorted(orphan_needed))
              sys.exit(1)
          print('indirect closure gate OK: %d bundled libs reachable from libkrita_bridge.so' % len(files))
          PYEOF

      - name: Build Android APK (release, real engine)
        run: flutter build apk --release

      - name: Verify APK contains the engine + runtime
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libkrita_bridge.so' \
            || { echo 'FATAL: engine .so not in APK'; exit 1; }
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libQt5Core_arm64-v8a.so' \
            || { echo 'FATAL: Qt runtime not in APK'; exit 1; }
          cp "$APK" feather-krita-android-real-engine.apk
          ls -lh feather-krita-android-real-engine.apk

      - name: Upload Android build (real engine)
        uses: actions/upload-artifact@v4
        with:
          name: feather-krita-android-real-engine
          path: feather-krita-android-real-engine.apk
          retention-days: 30
