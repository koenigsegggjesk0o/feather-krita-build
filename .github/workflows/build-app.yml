name: Build Feather-Krita App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'windows/**'
      - 'android/**'
      - 'assets/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - 'native/krita_bridge/**'

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze (infos non-fatal)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Windows EXE (release)
        run: flutter build windows --release

      - name: Verify bundled DLL next to exe
        shell: pwsh
        run: |
          $exe = "build/windows/x64/runner/Release/feather_krita.exe"
          $dll = "build/windows/x64/runner/Release/krita_bridge.dll"
          if (-not (Test-Path $exe)) { Get-ChildItem build/windows/x64/runner/Release; Write-Error "exe missing"; exit 1 }
          if (-not (Test-Path $dll)) { Write-Error "krita_bridge.dll NOT bundled next to exe"; exit 1 }
          Write-Host "OK: exe + krita_bridge.dll present in Release output"

      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath feather-krita-windows.zip
          Get-Item feather-krita-windows.zip | Select-Object Name, Length

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: feather-krita-windows
          path: feather-krita-windows.zip
          retention-days: 30

  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # Regression suite added in loop-20. Serial because the GUI tests
      # allocate several 2048x2048 texture buffers each; parallel file
      # VMs on memory-limited runners can OOM (flaky "did not complete").
      - name: Run regression suite (serial)
        run: flutter test --concurrency=1

      - name: Build Android APK (release, debug-signed for direct install)
        run: flutter build apk --release

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk feather-krita-android.apk
          ls -la feather-krita-android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: feather-krita-android
          path: feather-krita-android.apk
          retention-days: 30


  build-windows-real-engine:
    # Windows desktop build bundling the REAL Krita engine (merged
    # krita_bridge_real.dll = bridge glue + 955 krita objects in ONE image,
    # MSVC x64, plus Qt5/KF5/vcpkg runtime DLLs), verified end-to-end via
    # the app's own Dart FFI bindings running on the Dart VM (loop-35,
    # roadmap b). Krita source: real v6.0.4, never modified.
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Find latest green krita-build run
        id: engine_run
        shell: bash
        run: |
          RID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/krita-build.yml/runs?status=success&per_page=10" \
            | python -c 'import sys,json;rs=json.load(sys.stdin)["workflow_runs"];rs.sort(key=lambda r:(r["created_at"],r["id"]),reverse=True);print(rs[0]["id"])')
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
          echo "Latest green krita-build run: $RID"

      - name: Download real-engine artifact
        uses: actions/download-artifact@v4
        with:
          name: krita-brush-engine-windows
          run-id: ${{ steps.engine_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: krita-engine

      - name: Build Windows app (release)
        run: flutter build windows --release

      - name: Bundle real engine into Release dir
        shell: bash
        run: |
          REL=build/windows/x64/runner/Release
          # single merged engine DLL: rename to the name the app's FFI loader
          # expects (krita_bridge.dll), plus every runtime DLL next to the exe
          cp krita-engine/bin/krita_bridge_real.dll "$REL/krita_bridge.dll"
          cp krita-engine/bin/*.dll "$REL/"
          echo "Release dir: $(ls "$REL" | wc -l) files"
          ls "$REL" | head -12

      - name: Dart FFI end-to-end smoke (real engine, self-contained)
        shell: bash
        run: |
          export PATH="$(pwd)/build/windows/x64/runner/Release:$PATH"
          dart run tool/ffi_real_smoke.dart "$(pwd)/build/windows/x64/runner/Release"

      - name: Package Windows zip (real engine)
        shell: bash
        run: |
          cd build/windows/x64/runner/Release
          powershell -NoProfile -Command "Compress-Archive -Path * -DestinationPath feather-krita-windows-real-engine.zip -Force"
          ls -lh feather-krita-windows-real-engine.zip

      - name: Upload Windows build (real engine)
        uses: actions/upload-artifact@v4
        with:
          name: feather-krita-windows-real-engine
          path: build/windows/x64/runner/Release/feather-krita-windows-real-engine.zip
          retention-days: 30

  build-linux-real-engine:
    # Linux desktop build bundling the REAL Krita engine (libkrita_bridge.so
    # renamed from libkrita_bridge_real.so + real libkrita*.so from the
    # krita-build workflow), verified end-to-end via the app's own Dart FFI
    # bindings running on the Dart VM.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps (fatal)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev patchelf zip

      - name: Install Krita runtime deps (best effort, ldd audit + FFI smoke gate)
        run: |
          sudo apt-get install -y \
            libqt5core5a libqt5gui5 libqt5widgets5 libqt5xml5 libqt5svg5 libqt5sql5 libqt5printsupport5 \
            libkf5i18n5 libkf5configcore5 libkf5configgui5 libkf5archive5 libkf5guiaddons5 libkf5widgetsaddons5 libkf5coreaddons5 libkf5itemviews5 \
            libgsl27 libgslcblas0 liblcms2-2 libimath-3-1-29 libopenexr-3-1-30 \
            libexiv2-27 libjson-c5 libquazip1-qt5-1 libunibreak5 libxi6 libxrender1 libxext6 || \
            echo "WARNING: some Krita runtime packages missing - ldd audit will report"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Find latest green krita-build run
        id: engine_run
        run: |
          RID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/krita-build.yml/runs?status=success&per_page=10" \
            | python3 -c 'import sys,json;rs=json.load(sys.stdin)["workflow_runs"];rs.sort(key=lambda r:(r["created_at"],r["id"]),reverse=True);print(rs[0]["id"])')
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
          echo "Latest green krita-build run: $RID"

      - name: Download real-engine artifact
        uses: actions/download-artifact@v4
        with:
          name: krita-brush-engine
          run-id: ${{ steps.engine_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: krita-engine

      - name: Build Linux app (release)
        run: flutter build linux --release

      - name: Bundle real engine + runtime closure into app bundle
        run: |
          BUNDLE=build/linux/x64/release/bundle
          mkdir -p $BUNDLE/lib
          cp krita-engine/lib/libkrita*.so* $BUNDLE/lib/
          cp krita-engine/lib/libkrita_bridge_real.so $BUNDLE/lib/libkrita_bridge.so
          # Self-contained bundle (loop-34): every libkrita*.so resolves its
          # libkrita* siblings from $ORIGIN (bundle/lib). DT_RUNPATH set here
          # makes the shipped zip work WITHOUT LD_LIBRARY_PATH.
          # 5-loop-80 RUNTIME CLOSURE: the loop-34 zip still needed the OS to
          # provide Qt5/KF5/exiv2/quazip/... (documented runtime deps) — a
          # hidden system requirement the Windows zip does not carry (it
          # bundles every DLL). Close it: enumerate the resolved dependency
          # closure of the engine libs with ldd and copy every shared lib
          # that is NOT part of the base desktop stack (glibc family,
          # toolchain runtime, X11/GL, GTK/GLib/font stack, ubiquitous base
          # libs — everything a normal Linux desktop already has) into
          # bundle/lib. The Krita-specific runtime (Qt5*, KF5*, icu,
          # double-conversion, pcre2-16, exiv2, quazip, gsl, lcms2,
          # openexr/imath, unibreak, json-c, deflate, gomp, ...) then ships
          # INSIDE the zip. The docker clean-host gate below is the proof.
          BUNDLE_ABS=$(readlink -f "$BUNDLE")
          for f in $BUNDLE/lib/libkrita*.so* $BUNDLE/lib/libkrita_bridge.so; do
            ldd "$f" 2>/dev/null
          done | awk '/=> \// {print $3; next} /^[[:space:]]*\// {print $1}' \
            | sort -u | while read -r so; do
            [ -n "$so" ] || continue
            case "$so" in "$BUNDLE_ABS"/*) continue ;; esac
            base=$(basename "$so")
            case "$base" in
              ld-linux*|libc.so*|libm.so*|libdl.so*|libpthread.so*|librt.so*|libresolv.so*|libcrypt.so*|libutil.so*|libanl.so*) continue ;; # glibc family
              libstdc++.so*|libgcc_s.so*) continue ;; # toolchain runtime
              libX*|libxcb*|libxkb*|libwayland*|libdrm*|libglvnd*|libGL*|libEGL*|libOpenGL*|libOSMesa*) continue ;; # X11/GL stack
              libgtk*|libgdk*|libglib*|libgobject*|libgio*|libgmodule*|libgthread*|libpango*|libcairo*|libatk*|libgdk_pixbuf*|libpixman*|libharfbuzz*|libthai*|libdatrie*) continue ;; # GTK/GLib/font stack
              libfontconfig*|libfreetype*|libexpat*|libuuid*|libpng*|libbrotli*|libzstd*|liblzma*|libbz2*|libz.so*|libmd*|libbsd*|libdbus*|libsystemd*|libselinux*|libmount*|libffi*|libpcre2-8*|libcap2*|libgcrypt*|liblz4*) continue ;; # ubiquitous system libs
              *) ;;
            esac
            cp -n "$so" "$BUNDLE/lib/" || true
          done
          # Every bundled .so resolves its siblings from $ORIGIN — the
          # Qt5Core -> icu / pcre2-16 / double-conversion chains close
          # inside bundle/lib.
          patchelf --set-rpath '$ORIGIN' $BUNDLE/lib/*.so*
          # Runtime dependency audit (warn-only; the docker clean-host gate
          # below is the proof).
          for f in $BUNDLE/lib/*.so*; do
            LDD=$(ldd "$f" 2>/dev/null | grep "not found" || true)
            if [ -n "$LDD" ]; then
              echo "WARNING unresolved deps for $(basename $f):"
              echo "$LDD"
            fi
          done
          echo "bundle/lib file count (post-closure): $(ls $BUNDLE/lib | wc -l)"

      - name: Dart FFI end-to-end smoke (real engine, self-contained)
        run: |
          echo '=== unresolved-dep audit (expect OK) ==='
          ldd build/linux/x64/release/bundle/lib/libkrita_bridge.so 2>&1 | grep 'not found' \
            && { echo 'FAIL: unresolved deps above'; exit 1; } \
            || echo 'OK: no unresolved deps'
          echo '=== dart FFI smoke WITHOUT LD_LIBRARY_PATH (proves $ORIGIN self-containment) ==='
          env -u LD_LIBRARY_PATH dart run tool/ffi_real_smoke.dart "$(pwd)/build/linux/x64/release/bundle"

      - name: Clean-host runtime closure gate (docker ubuntu:24.04, NO Qt/KF5)
        # 5-loop-80: the honest proof that the shipped zip is self-contained.
        # A bare ubuntu:24.04 container (same base as the runner, so glibc
        # matches) gets ONLY the desktop-stack libs any Linux desktop has
        # (X11/GL/fontconfig/freetype/glib/...) — NO Qt5, NO KF5, NO
        # exiv2/quazip/gsl/lcms2/openexr/icu. The gate script
        # (.github/scripts/fkr_closure_gate.py, mounted) dlopens the bridge,
        # reports the version, inits a context and loads a REAL preset
        # fixture purely from bundle/lib ($ORIGIN). The fixture comes from
        # the app repo at run time (the builder mirror has no test/).
        run: |
          BUNDLE=$(pwd)/build/linux/x64/release/bundle
          curl -sfL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -o /tmp/fkr_gate_fixture.kpp \
            "https://raw.githubusercontent.com/koenigsegggjesk0o/krita/feather-krita-flutter/test/fixtures/stock_basic_5_size.kpp"
          test -s /tmp/fkr_gate_fixture.kpp || { echo "FATAL: fixture download failed"; exit 1; }
          head -c 4 /tmp/fkr_gate_fixture.kpp | od -An -c | head -1
          docker run --rm \
            -v "$BUNDLE:/bundle" -v "/tmp/fkr_gate_fixture.kpp:/fixture.kpp:ro" \
            -v "$(pwd)/.github/scripts/fkr_closure_gate.py:/gate.py:ro" \
            ubuntu:24.04 bash -e -c '
              export HOME=/tmp
              apt-get update -qq
              (DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
                python3 libgl1 libx11-6 libxcb1 libxext6 libxrender1 libxi6 \
                libfontconfig1 libfreetype6 libharfbuzz0b libpng16-16t64 \
                libglib2.0-0t64 libdbus-1-3 libxkbcommon0 libmd0 libbsd0 libbz2-1.0 \
                || DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
                python3 libgl1 libx11-6 libxcb1 libxext6 libxrender1 libxi6 \
                libfontconfig1 libfreetype6 libharfbuzz0b libpng16-16 \
                libglib2.0-0 libdbus-1-3 libxkbcommon0 libmd0 libbsd0 libbz2-1.0)
              python3 /gate.py
            '

      - name: Package Linux zip
        run: |
          cd build/linux/x64/release
          zip -qr feather-krita-linux-real-engine.zip bundle
          ls -lh feather-krita-linux-real-engine.zip

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: feather-krita-linux-real-engine
          path: build/linux/x64/release/feather-krita-linux-real-engine.zip
          retention-days: 30

  build-android-real-engine:
    # Android build bundling the REAL Krita engine (merged libkrita_bridge.so
    # = bridge glue + 959 krita objects in ONE image, NDK, plus Qt5/KF5/icu
    # runtime .so via jniLibs), loop-36 (roadmap c). Since loop-61 the APK
    # is a FAT real-engine bundle for BOTH arm64-v8a (device deliverable)
    # and x86_64 (emulator-testable natively on CI x86_64 runners — retires
    # the loop-60 ARM-translation wall). The app's Dart FFI loader opens
    # 'libkrita_bridge.so' by name on Android, so the real engine replaces
    # the fallback bridge seamlessly. Krita source: real v6.0.4, never
    # modified.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Find latest green krita-build run
        id: engine_run
        run: |
          RID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/krita-build.yml/runs?status=success&per_page=10" \
            | python3 -c 'import sys,json;rs=json.load(sys.stdin)["workflow_runs"];rs.sort(key=lambda r:(r["created_at"],r["id"]),reverse=True);print(rs[0]["id"])')
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
          echo "Latest green krita-build run: $RID"

      - name: Download real-engine artifact (arm64-v8a)
        uses: actions/download-artifact@v4
        with:
          name: krita-brush-engine-android-arm64-v8a
          run-id: ${{ steps.engine_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: krita-engine-arm64-v8a

      - name: Download real-engine artifact (x86_64)
        uses: actions/download-artifact@v4
        with:
          name: krita-brush-engine-android-x86_64
          run-id: ${{ steps.engine_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: krita-engine-x86_64

      - name: Bundle real engine into jniLibs (arm64-v8a + x86_64, fat APK)
        run: |
          for ABI in arm64-v8a x86_64; do
            JLIB=android/app/src/main/jniLibs/$ABI
            mkdir -p "$JLIB"
            cp krita-engine-$ABI/lib/libkrita_bridge.so "$JLIB/"
            # runtime .so from that ABI's engine bundle (skip strays named
            # after the OTHER abi — Qt universal-package naming guard)
            if [ "$ABI" = arm64-v8a ]; then OTHER=x86_64; else OTHER=arm64; fi
            find "krita-engine-$ABI/android/$ABI" -name '*.so' ! -name "*$OTHER*" \
              -exec cp {} "$JLIB/" \;
            # Android robustness (5-loop-66, corrected-approach-A): the staged
            # Qt/KF5 runtime .so files export JNI_OnLoad hooks that FindClass
            # Qt Android bootstrap classes which do NOT exist in a Flutter
            # APK — if ART's JNI_OnLoad search ever misses our bridge's own
            # hook it lands on one of those and dies with JNI_ERR (5-loop-61
            # iter-2 evidence). Rename JNI_OnLoad inside .dynstr of every
            # staged runtime copy (same byte length => structure-preserving;
            # GNU objcopy --localize-symbol proven NOT to touch .dynsym) so
            # libkrita_bridge.so's hook (JavaVM capture + g_javaVm injection)
            # remains the ONLY dlsym-visible candidate. STAGED COPIES ONLY —
            # engine artifacts and Krita source stay byte-identical.
            python3 .github/scripts/localize_jni_onload.py "$JLIB"
            ls -la "$JLIB" | head -40
            NB=$(ls "$JLIB" | wc -l)
            echo "jniLibs/$ABI: $NB files"
            [ "$NB" -ge 5 ] || { echo "FATAL: $ABI bundle too small"; exit 1; }
          done

      - name: DT_NEEDED audit (every dependency present, per ABI)
        # loop-61: the audit now runs against BOTH jniLibs ABIs via the
        # extracted .github/scripts/android_dt_audit.sh (logic identical
        # to the loop-45 arm64-only inline version, verified green).
        run: |
          RE=$(find /usr/local/lib/android/sdk/ndk -name 'llvm-readelf' | sort | tail -1)
          test -n "$RE" || RE=readelf
          bash .github/scripts/android_dt_audit.sh android/app/src/main/jniLibs/arm64-v8a "$RE"
          bash .github/scripts/android_dt_audit.sh android/app/src/main/jniLibs/x86_64 "$RE"
          # 5-loop-66 gate (corrected-approach-A): JNI_OnLoad must be an
          # exported dynamic symbol of libkrita_bridge.so ONLY — the staged
          # Qt runtime hooks were localized at staging (see bundle step);
          # a GLOBAL/WEAK JNI_OnLoad anywhere else means the hardening was
          # skipped and ART's BFS can find a crashing Qt hook.
          for ABI in arm64-v8a x86_64; do
            for so in android/app/src/main/jniLibs/$ABI/*.so; do
              EXPORTS=$("$RE" --dyn-syms "$so" 2>/dev/null | awk '$7!="UND" && $8=="JNI_OnLoad" && ($5=="GLOBAL" || $5=="WEAK")')
              if [ -n "$EXPORTS" ] && [ "$(basename "$so")" != libkrita_bridge.so ]; then
                echo "FATAL: $(basename "$so") still exports JNI_OnLoad ($ABI)"; exit 1
              fi
            done
            "$RE" --dyn-syms "android/app/src/main/jniLibs/$ABI/libkrita_bridge.so" 2>/dev/null \
              | awk '$7!="UND" && $8=="JNI_OnLoad" && ($5=="GLOBAL" || $5=="WEAK") {found=1} END {exit found?0:1}' \
              || { echo "FATAL: libkrita_bridge.so lost its own JNI_OnLoad ($ABI)"; exit 1; }
          done
          echo 'OK: JNI_OnLoad exported by libkrita_bridge.so only, both ABIs (Qt hooks localized)'

      - name: Build Android APK (release, real engine)
        run: flutter build apk --release

      - name: Verify APK contains the engine + runtime (both ABIs)
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          for ABI in arm64-v8a x86_64; do
            unzip -l "$APK" | grep -q "lib/$ABI/libkrita_bridge.so" \
              || { echo "FATAL: engine .so not in APK for $ABI"; exit 1; }
            unzip -l "$APK" | grep -q "lib/$ABI/libQt5Core_${ABI}.so" \
              || { echo "FATAL: Qt runtime not in APK for $ABI"; exit 1; }
            NB=$(unzip -l "$APK" | grep -c "lib/$ABI/.*\.so")
            echo "$ABI .so count: $NB"
            [ "$NB" -ge 5 ] || { echo "FATAL: $ABI bundle too small"; exit 1; }
          done
          cp "$APK" feather-krita-android-real-engine.apk
          ls -lh feather-krita-android-real-engine.apk

      - name: Upload Android build (real engine)
        uses: actions/upload-artifact@v4
        with:
          name: feather-krita-android-real-engine
          path: feather-krita-android-real-engine.apk
          retention-days: 30
