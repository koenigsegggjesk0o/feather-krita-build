name: Android Emulator Smoke

# Loop-60: auto-verification that the real-engine Android APK actually
# INSTALLS and BOOTS on an Android emulator. Runs after every completed
# Build Feather-Krita App run (workflow_run) and on demand
# (workflow_dispatch) so a loop can test it without waiting for a fresh
# app build. The APK ships arm64-v8a engine .so only (libkrita_bridge.so
# = bridge glue + 959 krita objects, plus the Qt5/KF5/icu runtime), so
# the x86_64 emulator must run it through the Android 11+ ARM
# translation: the install pins --abi arm64-v8a to force that path (a
# fat-APK x86_64 extraction would silently drop the engine and the smoke
# would test the wrong thing). Krita source is never touched here; this
# workflow lives ONLY in the builder repo (the app repo has no runners).

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Feather-Krita App"]
    types: [completed]

jobs:
  apk-audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Resolve source build-app run
        id: src
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RID=${{ github.event.workflow_run.id }}
          else
            RID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-app.yml/runs?status=success&per_page=1" \
              | python3 -c 'import sys,json;print(json.load(sys.stdin)["workflow_runs"][0]["id"])')
          fi
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
          echo "source run: $RID"
      - name: Download real-engine APK artifact
        uses: actions/download-artifact@v4
        with:
          name: feather-krita-android-real-engine
          run-id: ${{ steps.src.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk
      - name: Audit APK (engine .so present, arch correct, manifest sane)
        run: |
          APK=$(find apk -name '*.apk' | head -1)
          test -n "$APK" || { echo 'FATAL: no APK in artifact'; exit 1; }
          ls -lh "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libkrita_bridge.so' \
            || { echo 'FATAL: engine .so missing from APK'; exit 1; }
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libQt5Core_arm64-v8a.so' \
            || { echo 'FATAL: Qt runtime missing from APK'; exit 1; }
          NB=$(unzip -l "$APK" | grep -c 'lib/arm64-v8a/.*\.so')
          echo "arm64 .so count: $NB"
          [ "$NB" -ge 5 ] || { echo 'FATAL: bundle too small'; exit 1; }
          unzip -p "$APK" lib/arm64-v8a/libkrita_bridge.so > /tmp/libkrita_bridge.so
          RE=$(find /usr/local/lib/android/sdk/ndk -name 'llvm-readelf' | sort | tail -1)
          test -n "$RE" || RE=readelf
          "$RE" -h /tmp/libkrita_bridge.so | grep -q 'AArch64' \
            || { echo 'FATAL: engine .so is not AArch64'; exit 1; }
          AAPT=$(find /usr/local/lib/android/sdk/build-tools -name aapt2 | sort | tail -1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.featherkrita.feather_krita'" \
            || { echo 'FATAL: unexpected package'; "$AAPT" dump badging "$APK" | head -5; exit 1; }
          "$AAPT" dump badging "$APK" | grep -q 'launchable-activity' \
            || { echo 'FATAL: no launchable activity'; exit 1; }
          echo 'APK audit OK'

  emulator-boot:
    needs: apk-audit
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout (for the smoke script)
        uses: actions/checkout@v4
      - name: Resolve source build-app run
        id: src
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RID=${{ github.event.workflow_run.id }}
          else
            RID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-app.yml/runs?status=success&per_page=1" \
              | python3 -c 'import sys,json;print(json.load(sys.stdin)["workflow_runs"][0]["id"])')
          fi
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
      - name: Download real-engine APK artifact
        uses: actions/download-artifact@v4
        with:
          name: feather-krita-android-real-engine
          run-id: ${{ steps.src.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk
      - name: Enable KVM group perms (first boot attempt ran -accel off)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
          [ -w /dev/kvm ] && echo 'KVM writable OK' || echo 'KVM still not writable'
      - name: Boot emulator, install APK, launch, soak
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot
          emulator-boot-timeout: 900
          # NOTE: the action executes `script` ONE sh -c PER LINE (variables
          # and line continuations do NOT survive) — the real logic lives in
          # the checked-out bash script.
          script: bash .github/scripts/android_smoke.sh
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-evidence
          path: |
            emulator_smoke.png
            app_logcat.txt
          retention-days: 14
          if-no-files-found: ignore
