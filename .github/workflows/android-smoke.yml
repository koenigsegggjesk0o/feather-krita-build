name: Android Emulator Smoke

# Loop-60/61: auto-verification that the real-engine Android APK actually
# INSTALLS and BOOTS on an Android emulator. Runs after every completed
# Build Feather-Krita App run (workflow_run) and on demand
# (workflow_dispatch) so a loop can test it without waiting for a fresh
# app build. Since loop-61 the APK is a FAT real-engine bundle for BOTH
# arm64-v8a (device deliverable) and x86_64 (emulator-testable) — the
# x86_64 engine on the x86_64 CI emulator runs NATIVELY (no ARM
# translation), which retires the loop-60 KNOWN LIMITATION (arm64-only
# bundle SIGSEGV under Android 11+ ARM translation, API 30+31). The
# install is NOT ABI-pinned: the emulator extracts its native x86_64 set
# (engine included). Krita source is never touched here; this workflow
# lives ONLY in the builder repo (the app repo has no runners).

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Feather-Krita App"]
    types: [completed]

jobs:
  apk-audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Resolve source build-app run
        id: src
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RID=${{ github.event.workflow_run.id }}
          else
            RID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-app.yml/runs?status=success&per_page=1" \
              | python3 -c 'import sys,json;print(json.load(sys.stdin)["workflow_runs"][0]["id"])')
          fi
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
          echo "source run: $RID"
      - name: Download real-engine APK artifact
        uses: actions/download-artifact@v4
        with:
          name: feather-krita-android-real-engine
          run-id: ${{ steps.src.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk
      - name: Audit APK (engine .so present, arch correct, manifest sane)
        run: |
          APK=$(find apk -name '*.apk' | head -1)
          test -n "$APK" || { echo 'FATAL: no APK in artifact'; exit 1; }
          ls -lh "$APK"
          RE=$(find /usr/local/lib/android/sdk/ndk -name 'llvm-readelf' | sort | tail -1)
          test -n "$RE" || RE=readelf
          # per-ABI: engine .so present, Qt runtime present, bundle big
          # enough, ELF machine matches (AArch64 / X86-64)
          for ABI in arm64-v8a x86_64; do
            unzip -l "$APK" | grep -q "lib/$ABI/libkrita_bridge.so" \
              || { echo "FATAL: engine .so missing from APK ($ABI)"; exit 1; }
            unzip -l "$APK" | grep -q "lib/$ABI/libQt5Core_${ABI}.so" \
              || { echo "FATAL: Qt runtime missing from APK ($ABI)"; exit 1; }
            NB=$(unzip -l "$APK" | grep -c "lib/$ABI/.*\.so")
            echo "$ABI .so count: $NB"
            [ "$NB" -ge 5 ] || { echo "FATAL: bundle too small ($ABI)"; exit 1; }
            unzip -p "$APK" "lib/$ABI/libkrita_bridge.so" > "/tmp/bridge_$ABI.so"
            case "$ABI" in
              arm64-v8a) ARCHPAT='AArch64' ;;
              x86_64)    ARCHPAT='X86-64' ;;
            esac
            "$RE" -h "/tmp/bridge_$ABI.so" | grep -q "$ARCHPAT" \
              || { echo "FATAL: engine .so is not $ARCHPAT ($ABI)"; "$RE" -h "/tmp/bridge_$ABI.so" | head -8; exit 1; }
          done
          AAPT=$(find /usr/local/lib/android/sdk/build-tools -name aapt2 | sort | tail -1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.featherkrita.feather_krita'" \
            || { echo 'FATAL: unexpected package'; "$AAPT" dump badging "$APK" | head -5; exit 1; }
          "$AAPT" dump badging "$APK" | grep -q 'launchable-activity' \
            || { echo 'FATAL: no launchable activity'; exit 1; }
          echo 'APK audit OK (arm64-v8a + x86_64 real engine)'

  emulator-boot:
    # Loop-61: with the x86_64 engine bundled (fat APK), the emulator boot
    # is NATIVE on the x86_64 CI runner (no ARM translation) — the loop-60
    # KNOWN LIMITATION is retired and this job is now a STRICT gate: every
    # green app build must install, launch and soak the real engine on the
    # API 30 x86_64 emulator without crashing. Evidence (screenshot +
    # filtered logcat) uploads on every outcome.
    needs: apk-audit
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout (for the smoke script)
        uses: actions/checkout@v4
      - name: Resolve source build-app run
        id: src
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RID=${{ github.event.workflow_run.id }}
          else
            RID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-app.yml/runs?status=success&per_page=1" \
              | python3 -c 'import sys,json;print(json.load(sys.stdin)["workflow_runs"][0]["id"])')
          fi
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
      - name: Download real-engine APK artifact
        uses: actions/download-artifact@v4
        with:
          name: feather-krita-android-real-engine
          run-id: ${{ steps.src.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk
      - name: Enable KVM group perms (first boot attempt ran -accel off)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
          [ -w /dev/kvm ] && echo 'KVM writable OK' || echo 'KVM still not writable'
      - name: Boot emulator, install APK, launch, soak (strict gate)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot
          emulator-boot-timeout: 900
          # NOTE: the action executes `script` ONE sh -c PER LINE (variables
          # and line continuations do NOT survive) — the real logic lives in
          # the checked-out bash script.
          script: bash .github/scripts/android_smoke.sh
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-evidence
          path: |
            emulator_smoke.png
            app_logcat.txt
          retention-days: 14
          if-no-files-found: ignore
