name: Android Emulator Smoke (real engine on-device)

# On-device proof for the REAL Krita brush engine on Android (loop-43;
# closes the long-standing loop-36 note: the per-ABI merged engine .so was
# device-ready, but the smoke gates had never been EXECUTED on an Android
# system).
#
# What this proves, end-to-end on a booted Android system:
#   - the merged real-engine libkrita_bridge.so (bridge glue + the full
#     krita object closure built from UNMODIFIED krita source by NDK)
#     dlopens and runs under bionic;
#   - dab generation, flow, hardness and paintop-identity ABI gates pass;
#   - the two real Krita stock preset fixtures (legacy PNG preset
#     containers, zTXt-compressed XML) load through the engine's own
#     container parser on-device.
#
# The engine is NEVER rebuilt here: artifacts are downloaded from a green
# krita-build run (workflow_dispatch input, default latest successful), so
# emulator bring-up can iterate without re-paying the engine build.
# The smoke executable is RELINKED in this workflow from the same source at
# the engine run's commit because the artifact binary carries an absolute
# builder-path DT_NEEDED entry (link-time artifact), which cannot resolve
# on-device; the relink produces the portable bare "libkrita_bridge.so"
# NEEDED + $ORIGIN runpath form. The bridge .so itself is used EXACTLY as
# built and uploaded by krita-build (a stripped COPY is pushed to keep the
# adb transfer fast — stripping does not change dynamic behavior; the
# unstripped original is what the real-engine APK ships).
#
# Krita source is NEVER modified — this workflow only tests it.

on:
  workflow_dispatch:
    inputs:
      engine_run_id:
        description: 'krita-build run id (default: latest successful)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: android-emulator-smoke
  cancel-in-progress: false

jobs:
  on-device-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SDK_ROOT: /usr/local/lib/android/sdk
      REPO: koenigsegggjesk0o/feather-krita-build
      TOKEN: ${{ secrets.KRITA_SOURCE_TOKEN }}
    steps:
      - name: Resolve engine run (id + commit)
        id: resolve
        run: |
          set -euo pipefail
          AUTH="Authorization: token ${TOKEN}"
          RID="${{ github.event.inputs.engine_run_id }}"
          if [ -z "$RID" ]; then
            RID=$(curl -sf -H "$AUTH" \
              "https://api.github.com/repos/${REPO}/actions/workflows/krita-build.yml/runs?status=success&per_page=1" \
              | python3 -c 'import sys,json;print(json.load(sys.stdin)["workflow_runs"][0]["id"])')
          fi
          SHA=$(curl -sf -H "$AUTH" \
            "https://api.github.com/repos/${REPO}/actions/runs/$RID" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["head_sha"])')
          echo "engine run: $RID @ $SHA"
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
          echo "head_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Download engine artifacts (x86_64)
        run: |
          set -euo pipefail
          AUTH="Authorization: token ${TOKEN}"
          # NOTE: keep the python one-liner on ONE line — a multi-line -c
          # source inherits the YAML block indent and dies with
          # IndentationError (found by bring-up run 35505669591).
          AID=$(curl -sf -H "$AUTH" "https://api.github.com/repos/${REPO}/actions/runs/${{ steps.resolve.outputs.run_id }}/artifacts" | python3 -c 'import sys,json; arts=json.load(sys.stdin)["artifacts"]; m=[a for a in arts if a["name"]=="krita-brush-engine-android-x86_64"]; assert m, "artifact krita-brush-engine-android-x86_64 not found on engine run"; print(m[0]["id"])')
          echo "artifact id: $AID"
          curl -sfL -H "$AUTH" -o engine.zip \
            "https://api.github.com/repos/${REPO}/actions/artifacts/$AID/zip"
          mkdir engine && unzip -q engine.zip -d engine
          test -f engine/lib/libkrita_bridge.so \
            || { echo '##[error] bridge .so missing from artifact'; exit 1; }
          test -f engine/android/x86_64/libc++_shared.so \
            || { echo '##[error] libc++_shared missing from artifact bundle'; exit 1; }
          echo "engine artifact unpacked: $(du -sh engine | cut -f1)"

      - name: Fetch bridge + smoke sources and fixtures (mirror @ engine sha)
        run: |
          set -euo pipefail
          # Tooling comes from mirror MAIN (smoke_main refactor + JNI boot
          # are load-bearing-neutral against the stable ABI), while the
          # engine BINARIES stay pinned to the engine run's artifacts.
          BASE="https://raw.githubusercontent.com/${REPO}/main"
          mkdir -p src
          for f in native/krita_bridge/krita_bridge.h \
                   native/krita_bridge/smoke_test_real.cpp \
                   native/krita_bridge/smoke_jni.cpp \
                   native/krita_bridge/FkrSmoke.java \
                   test/fixtures/stock_basic_5_size.kpp \
                   test/fixtures/stock_eraser_circle.kpp; do
            curl -fsSL "$BASE/$f" -o "src/$(basename "$f")" \
              || { echo "##[error] fetch failed: $f"; exit 1; }
          done
          head -3 src/krita_bridge.h
          ls -la src/

      - name: Stage runtime + relink on-device smoke (bare NEEDED, $ORIGIN rpath)
        run: |
          set -euo pipefail
          NDK=$(ls -d "${SDK_ROOT}"/ndk/* 2>/dev/null | sort -V | tail -1)
          test -n "$NDK" || { echo '##[error] no NDK on runner'; exit 1; }
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "NDK: $NDK"
          STAGE=stage
          mkdir -p "$STAGE"
          # ---- runtime .so set (what the bridge + Qt closure DT_NEEDED)
          cp engine/lib/libkrita_bridge.so "$STAGE/"
          cp engine/android/x86_64/libQt5*_x86_64.so "$STAGE/"
          cp engine/android/x86_64/libKF5*.so* "$STAGE/"
          cp engine/android/x86_64/libquazip*.so "$STAGE/"
          # ---- libc++_shared.so: the engine artifact carries a PRUNED
          # OLD runtime (1.6MB, pre-LLVM-12 — no __cxa_init_primary_exception;
          # found by run 35507751331: CANNOT LINK EXECUTABLE at load). The
          # bridge was compiled against a modern NDK, so the on-device
          # runtime must be modern too. libc++_shared is backwards
          # ABI-compatible, so the r21-era Qt/KF5 libs keep working with a
          # newer runtime. Source it from the runner's NDKs (first whose
          # x86_64 copy exports the modern symbol), else download r27c —
          # the same source krita-build's android deps step uses.
          LIBCXX_SRC=""
          for N in $(ls -d "${SDK_ROOT}"/ndk/* 2>/dev/null | sort -V | tac); do
            while IFS= read -r CAND; do
              # GNU readelf -W = full symbol names (llvm-readelf truncates
              # long names even in --dyn-syms — false negatives cost two
              # CI round-trips: runs 35508334166 + 35508812780)
              if readelf -Ws "$CAND" 2>/dev/null | grep -q '__cxa_init_primary_exception'; then
                LIBCXX_SRC="$CAND"
                break 2
              fi
            done < <(find "$N" -name libc++_shared.so -path '*sysroot/usr/lib/x86_64-linux-android/*' 2>/dev/null | head -5)
          done
          if [ -z "$LIBCXX_SRC" ]; then
            # NOTE: the pairing-correct runtime is r29 (the bridge was
            # compiled by the r29 clang). r27c's sysroot runtime (1.6MB)
            # genuinely LACKS __cxa_init_primary_exception — proven by
            # run 35507751331 (CANNOT LINK on-device) + byte-size match
            # with the artifact copy. Gate greps use llvm-readelf, which
            # prints FULL symbol names (GNU readelf truncates them).
            echo 'no local NDK exports the modern symbol — downloading NDK r29 runtime'
            curl -sfL --retry 3 -o /tmp/ndk29.zip \
              https://dl.google.com/android/repository/android-ndk-r29-linux.zip
            unzip -j -o -q /tmp/ndk29.zip \
              'android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so' \
              -d /tmp/ndk29lib
            LIBCXX_SRC=/tmp/ndk29lib/libc++_shared.so
          fi
          test -s "$LIBCXX_SRC" || { echo '##[error] no usable modern libc++_shared.so found'; exit 1; }
          cp "$LIBCXX_SRC" "$STAGE/libc++_shared.so"
          echo "libc++_shared.so source: $LIBCXX_SRC ($(stat -c %s "$STAGE/libc++_shared.so") bytes)"
          readelf -Ws "$STAGE/libc++_shared.so" | grep -q '__cxa_init_primary_exception' \
            || { echo '##[error] staged libc++_shared still lacks the modern symbol set'; exit 1; }
          # stripped COPY for fast adb push (dynamic behavior unchanged;
          # the unstripped original ships in the real-engine APK)
          "$TC/llvm-strip" "$STAGE/libkrita_bridge.so"
          echo "bridge after strip: $(stat -c %s "$STAGE/libkrita_bridge.so") bytes"
          # ---- JVM-less boot shim: Krita's (unmodified)
          # KisAndroidCrashHandler.cpp static init calls
          # QStandardPaths::writableLocation, which on Android reaches for
          # the JavaVM via JNI — absent in a shell executable -> SIGSEGV
          # in the linker's call_constructors (run 35510837084,
          # tombstone: _GLOBAL__sub_I_KisAndroidCrashHandler.cpp:35 ->
          # QJNIEnvironmentPrivate -> null deref).
          # Surgical fix, NO Krita/Qt changes: a 1-symbol shim that
          # answers writableLocation with a real writable dir. The shim is
          # put FIRST in the bridge's NEEDED order (replace Qt5Core with
          # the shim, then re-append Qt5Core) so the bridge's UNDEF lookup
          # resolves to the shim deterministically (local-group order).
          cat > /tmp/qsp_shim.cpp <<'SHIMEOF'
          // 16-bit literal; QChar is 2 bytes on Qt5 (char16_t-compatible)
          static const char16_t kPath[] = u"/data/local/tmp/fkr";
          extern "C" {
          void _ZN7QStringC1EPK5QChari(void* self, const char16_t* s, int len);
          // QJNIObjectPrivate::isSameObject(jobject) const -> bool —
          // JVM-less boot guard: never deref a null JNIEnv (the shim is
          // the first definition every consumer sees)
          bool _ZNK17QJNIObjectPrivate12isSameObjectEP8_jobject(void* self, void* obj) {
              (void)self; (void)obj;
              return false;
          }
          // QStandardPaths::writableLocation(StandardLocation) -> QString
          // (non-trivial return: hidden sret pointer is param 1)
          void _ZN14QStandardPaths16writableLocationENS_16StandardLocationE(void* sret, int type) {
              (void)type;
              _ZN7QStringC1EPK5QChari(sret, kPath, 19);
          }
          }
          SHIMEOF
          # NOTE: patchelf re-sorts .dynamic on every edit, so NEEDED-order
          # games are NOT deterministic (runs 35511658356 + 35512117213).
          # Masquerade instead: the shim TAKES OVER the name
          # libQt5Core_x86_64.so (which every consumer already NEEDs) and
          # the real core is renamed + re-SONAMEd to
          # libQt5Core_real_x86_64.so as a dependency OF the shim. Symbol
          # lookups hit the 1-symbol stub first (DFS solist order), and
          # every other Qt5Core symbol still resolves from the renamed
          # real core. No bridge patching at all.
          mv "$STAGE/libQt5Core_x86_64.so" "$STAGE/libQt5Core_real_x86_64.so"
          "$TC/llvm-strip" --strip-debug "$STAGE/libQt5Core_real_x86_64.so" 2>/dev/null || true
          patchelf --set-soname libQt5Core_real_x86_64.so "$STAGE/libQt5Core_real_x86_64.so"
          "$TC/x86_64-linux-android24-clang++" -std=c++17 -O2 -fPIC -shared -nostdlib++ \
            /tmp/qsp_shim.cpp -o "$STAGE/libQt5Core_x86_64.so" \
            "-L$PWD/$STAGE" -lQt5Core_real_x86_64 -Wl,-soname,libQt5Core_x86_64.so
          "$TC/llvm-readelf" -d "$STAGE/libQt5Core_real_x86_64.so" | grep -q 'SONAME.*libQt5Core_real_x86_64.so' \
            || { echo '##[error] real-core SONAME rename failed'; exit 1; }
          "$TC/llvm-readelf" -d "$STAGE/libQt5Core_x86_64.so" | grep -q 'SONAME.*libQt5Core_x86_64.so' \
            || { echo '##[error] shim SONAME not set'; exit 1; }
          echo 'shim masquerade wired: stub = libQt5Core_x86_64.so, real = libQt5Core_real_x86_64.so'
          # ---- AndroidExtras masquerade: KF5I18n's static init calls
          # QtAndroid::androidContext() -> QtNative activity — absent in a
          # bare process. Shim returns a NULL QAndroidJniObject (Qt's own
          # null-object paths degrade gracefully); the real module is
          # renamed + re-SONAMEd as the shim's dependency (same DFS
          # priority argument as the Core masquerade).
          mv "$STAGE/libQt5AndroidExtras_x86_64.so" "$STAGE/libQt5AndroidExtras_real_x86_64.so"
          patchelf --set-soname libQt5AndroidExtras_real_x86_64.so "$STAGE/libQt5AndroidExtras_real_x86_64.so"
          cat > /tmp/axe_shim.cpp <<'AXEOF'
          // null QAndroidJniObject: m_jobject = m_jclass = nullptr
          extern "C" {
          void _ZN9QtAndroid14androidContextEv(void* sret) {
              unsigned char* p = static_cast<unsigned char*>(sret);
              for (int i = 0; i < 16; ++i) p[i] = 0;
          }
          }
          AXEOF
          "$TC/x86_64-linux-android24-clang++" -std=c++17 -O2 -fPIC -shared -nostdlib++ \
            /tmp/axe_shim.cpp -o "$STAGE/libQt5AndroidExtras_x86_64.so" \
            "-L$PWD/$STAGE" -lQt5AndroidExtras_real_x86_64 -Wl,-soname,libQt5AndroidExtras_x86_64.so
          "$TC/llvm-readelf" -d "$STAGE/libQt5AndroidExtras_real_x86_64.so" | grep -q 'SONAME.*libQt5AndroidExtras_real_x86_64.so' \
            || { echo '##[error] real AndroidExtras SONAME rename failed'; exit 1; }
          echo 'AndroidExtras masquerade wired: stub = libQt5AndroidExtras_x86_64.so, real = libQt5AndroidExtras_real_x86_64.so'
          # ---- dynamic-closure completion: the engine merge link
          # OVER-LINKS (the krita object closure references symbols from
          # libraries that never enter the NEEDED chain — e.g. QuaZip via
          # kritastore (run 35509208740), QPrinter/Qt5PrintSupport via
          # kritawidgets (run 35509902482)). bionic only resolves UNDEFs
          # from the LOAD closure, so every staged runtime lib must be
          # DT_NEEDED somewhere. Add the entry for each staged lib that is
          # not already in the bridge's NEEDED list (their own NEEDEDs are
          # self-contained within the staged set). The engine merge step
          # must eventually do the exact link (APK campaign note).
          sudo apt-get install -y patchelf >/dev/null 2>&1 || sudo apt-get install -y patchelf
          # raw dynamic output once; dedupe via exact '[name]' substring
          # match (field parsing proved brittle across readelf flavors)
          DYNOUT=$("$TC/llvm-readelf" -d "$STAGE/libkrita_bridge.so")
          for lib in "$STAGE"/lib*.so; do
            name=$(basename "$lib")
            [ "$name" = "libkrita_bridge.so" ] && continue
            [ "$name" = "libc++_shared.so" ] && continue
            [ "$name" = "libQt5Core_real_x86_64.so" ] && continue
            [ "$name" = "libQt5AndroidExtras_real_x86_64.so" ] && continue
            # Core (the shim) is already a direct NEEDED of every consumer
            if printf '%s\n' "$DYNOUT" | grep -qF "[$name]"; then continue; fi
            patchelf --add-needed "$name" "$STAGE/libkrita_bridge.so"
            echo "added DT_NEEDED: $name"
          done
          # head closes the pipe -> grep SIGPIPE -> pipefail aborts the
          # step (found by run 35510330096); audit prints are best-effort
          "$TC/llvm-readelf" -d "$STAGE/libkrita_bridge.so" | grep NEEDED | sed -n '1,40p' || true
          # gate: the real core must not be a direct bridge dependency —
          # under the masquerade the stub's priority comes from being the
          # FILE behind the libQt5Core_x86_64.so name (shim -> real-core
          # DFS), so NEEDED order is irrelevant; direct real-core NEEDING
          # would be the only way around the stub
          AUDIT=$("$TC/llvm-readelf" -d "$STAGE/libkrita_bridge.so")
          if printf '%s\n' "$AUDIT" | grep -qF '[libQt5Core_real_x86_64.so]'; then
            echo '##[error] real core is a direct bridge NEEDED'
            exit 1
          fi
          # ---- relink the smoke exe: the artifact exe's NEEDED entry is
          # the absolute builder path (recorded at link time) and cannot
          # resolve on-device. Relink from the same source against the
          # shipped bridge .so so DT_NEEDED is the portable bare name.
          "$TC/x86_64-linux-android24-clang++" -std=c++17 -O2 -fPIE -pie \
            -Isrc src/smoke_test_real.cpp \
            "-L$PWD/$STAGE" -lkrita_bridge \
            -Wl,-rpath,'$ORIGIN' \
            -o "$STAGE/smoke_test_real_android"
          echo '--- relinked smoke ELF audit'
          "$TC/llvm-readelf" -d "$STAGE/smoke_test_real_android" | grep -E 'NEEDED|RUNPATH'
          "$TC/llvm-readelf" -d "$STAGE/smoke_test_real_android" \
            | grep -q 'Shared library: \[libkrita_bridge.so\]' \
            || { echo '##[error] smoke NEEDED is not the bare bridge name'; exit 1; }
          "$TC/llvm-readelf" -d "$STAGE/smoke_test_real_android" \
            | grep -q 'Library runpath: \[\$ORIGIN\]' \
            || { echo '##[error] smoke RUNPATH is not $ORIGIN'; exit 1; }
          # ---- JNI smoke library: smoke_main + JNI entry, loaded inside
          # the ART VM (app_process boot; bare shell exec has no JVM and
          # the Qt/KF5 android statics SIGSEGV — runs 35510837084/35513090509)
          "$TC/x86_64-linux-android24-clang++" -std=c++17 -O2 -fPIC -shared \
            -Isrc src/smoke_test_real.cpp src/smoke_jni.cpp \
            "-L$PWD/$STAGE" -lkrita_bridge \
            -o "$STAGE/libsmoke_jni.so"
          test -s "$STAGE/libsmoke_jni.so" || { echo '##[error] smoke_jni build failed'; exit 1; }
          "$TC/llvm-readelf" -d "$STAGE/libsmoke_jni.so" | grep NEEDED
          # ---- fixtures + app_process boot classes
          cp src/stock_basic_5_size.kpp src/stock_eraser_circle.kpp "$STAGE/"
          chmod +x "$STAGE/smoke_test_real_android"
          echo "--- staged runtime: $(du -sh "$STAGE" | cut -f1), $(ls "$STAGE" | wc -l) files"

      - name: Enable KVM
        run: |
          set -euo pipefail
          test -e /dev/kvm || { echo '##[error] /dev/kvm unavailable on runner'; exit 1; }
          sudo chmod 666 /dev/kvm
          echo "KVM: $(ls -l /dev/kvm)"

      - name: Create AVD + boot emulator (API 30, google_apis, x86_64)
        timeout-minutes: 25
        run: |
          set -euo pipefail
          SM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          AVDM="$SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          java -version 2>&1 | head -1 || true
          "$SM" --version || true
          df -h / | tail -1
          echo '--- accepting licenses'
          # yes always dies with SIGPIPE (141) when sdkmanager closes
          # stdin — under pipefail the pipeline reports failure even on
          # SUCCESS ("All SDK package licenses accepted" was printed in
          # run 35506153720). Gate on the OUTCOME, not the pipe rc.
          set +e
          yes | "$SM" --licenses > /tmp/lic.log 2>&1
          RC=$?
          set -e
          echo "licenses rc=$RC (141 = SIGPIPE from yes, expected)"
          grep -q 'All SDK package licenses accepted' /tmp/lic.log \
            || { echo '##[error] license acceptance failed'; tail -30 /tmp/lic.log; exit 1; }
          echo '--- installing system image (API 30 google_apis x86_64)'
          # no yes-pipe here: licenses are accepted, install runs
          # unattended (EOF on any unexpected prompt aborts cleanly)
          "$SM" "system-images;android-30;google_apis;x86_64" "platforms;android-30" > /tmp/img.log 2>&1 \
            || { echo '##[error] system-image install failed'; tail -40 /tmp/img.log; exit 1; }
          test -d "$SDK_ROOT/system-images/android-30/google_apis/x86_64" \
            || { echo '##[error] system image dir missing after install'; tail -20 /tmp/img.log; exit 1; }
          tail -3 /tmp/img.log
          # AVD-home alignment (run 35506353784: emulator died with
          # "Unknown AVD name [fkr-smoke]" — modern avdmanager defaults
          # to ~/.config/.android/avd while the emulator searches
          # $ANDROID_AVD_HOME / $HOME/.android/avd). Pin BOTH tools to
          # one tree, then verify the ini exists.
          export ANDROID_USER_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          rm -rf "$ANDROID_AVD_HOME/fkr-smoke" "$ANDROID_AVD_HOME/fkr-smoke.avd"
          echo no | "$AVDM" create avd -n fkr-smoke \
            -k "system-images;android-30;google_apis;x86_64"
          test -f "$ANDROID_AVD_HOME/fkr-smoke.ini" \
            || { echo '##[error] AVD ini not created in pinned AVD home'; ls -la "$ANDROID_AVD_HOME" || true; exit 1; }
          "$SDK_ROOT/emulator/emulator" -avd fkr-smoke \
            -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -accel on \
            -memory 3072 -no-snapshot -wipe-data \
            > /tmp/emulator.log 2>&1 &
          echo $! > /tmp/emulator.pid
          ADB="$SDK_ROOT/platform-tools/adb"
          echo '--- waiting for device (bounded, liveness-checked)'
          for i in $(seq 1 60); do
            if "$ADB" get-state >/dev/null 2>&1; then
              echo "device visible after ~$((i * 5))s"
              break
            fi
            if ! kill -0 "$(cat /tmp/emulator.pid)" 2>/dev/null; then
              echo '##[error] emulator process died before device appeared'
              tail -60 /tmp/emulator.log || true
              exit 1
            fi
            sleep 5
          done
          if ! "$ADB" get-state >/dev/null 2>&1; then
            echo '##[error] device never became visible (5 min)'
            tail -60 /tmp/emulator.log || true
            exit 1
          fi
          for i in $(seq 1 90); do
            B=$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "$B" = "1" ]; then
              echo "emulator boot completed after ~$((i * 10))s"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/emulator.pid)" 2>/dev/null; then
              echo '##[error] emulator process died during boot wait'
              tail -60 /tmp/emulator.log || true
              exit 1
            fi
            sleep 10
          done
          echo '##[error] emulator boot timeout (15 min)'
          tail -60 /tmp/emulator.log || true
          exit 1

      - name: Capture device identity
        run: |
          ADB="$SDK_ROOT/platform-tools/adb"
          {
            echo '--- device identity'
            "$ADB" shell getprop ro.product.cpu.abi
            "$ADB" shell getprop ro.build.version.release
            "$ADB" shell getprop ro.build.version.sdk
            "$ADB" shell getprop ro.build.fingerprint
          } | tee /tmp/device_identity.txt

      - name: Build FkrSmoke dex (needs android.jar from the boot step)
        run: |
          set -euo pipefail
          mkdir -p jclasses
          "$JAVA_HOME/bin/javac" --release 8 -d jclasses src/FkrSmoke.java
          BT=$(ls "$SDK_ROOT/build-tools/" | sort -V | tail -1)
          "$SDK_ROOT/build-tools/$BT/d8" --release --min-api 24 \
            --lib "$SDK_ROOT/platforms/android-30/android.jar" \
            --output stage jclasses/FkrSmoke.class
          test -s stage/classes.dex || { echo '##[error] dex build failed'; exit 1; }
          echo "dex built: $(stat -c %s stage/classes.dex) bytes"

      - name: Push runtime to device
        timeout-minutes: 15
        run: |
          set -euo pipefail
          ADB="$SDK_ROOT/platform-tools/adb"
          "$ADB" shell "rm -rf /data/local/tmp/fkr && mkdir -p /data/local/tmp/fkr"
          "$ADB" push stage/. /data/local/tmp/fkr/
          "$ADB" shell "chmod 755 /data/local/tmp/fkr/smoke_test_real_android"
          echo '--- device-side listing'
          "$ADB" shell "ls -la /data/local/tmp/fkr | head -12"

      - name: Run on-device smoke (REAL engine ABI gates + stock fixtures)
        run: |
          set -euo pipefail
          ADB="$SDK_ROOT/platform-tools/adb"
          set -o pipefail
          # app_process boots ART for this process: the Qt/KF5 android
          # statics need a JavaVM (see smoke_jni.cpp header). FkrSmoke
          # loads the chain in VM-registration order, then runs
          # smoke_main through the JNI wrapper; System.exit propagates rc.
          "$ADB" shell "export LD_LIBRARY_PATH=/data/local/tmp/fkr; export CLASSPATH=/data/local/tmp/fkr/classes.dex; cd /data/local/tmp/fkr && /system/bin/app_process / FkrSmoke /data/local/tmp/fkr/stock_basic_5_size.kpp /data/local/tmp/fkr/stock_eraser_circle.kpp" \
            2>&1 | tee /tmp/smoke_output.txt
          grep -q 'SMOKE OK' /tmp/smoke_output.txt \
            || { echo '##[error] SMOKE OK banner missing — on-device gates failed'; exit 1; }

      - name: Diagnostics (on failure)
        if: failure()
        run: |
          # adb BLOCKS forever when no device is attached (e.g. failure
          # before boot) — guard every adb call with get-state + timeout
          # (found by bring-up run 35505669591: logcat -d hung ~6 min).
          ADB="$SDK_ROOT/platform-tools/adb"
          if timeout 10 "$ADB" get-state >/dev/null 2>&1; then
            LOGCAT=$(timeout 20 "$ADB" logcat -d 2>/dev/null | grep -E 'DEBUG|Fatal|CRASH|linker' | tail -80 || true)
          else
            LOGCAT='(no device attached)'
          fi
          {
            echo '--- device identity'
            cat /tmp/device_identity.txt 2>/dev/null || true
            echo '--- smoke output (if any)'
            cat /tmp/smoke_output.txt 2>/dev/null || true
            echo '--- emulator log tail'
            tail -60 /tmp/emulator.log 2>/dev/null || true
            echo '--- logcat crash tail'
            printf '%s\n' "$LOGCAT"
          } > diag.txt || true
          cat diag.txt || true
          mkdir -p diagout
          cp diag.txt diagout/
          cp /tmp/smoke_output.txt diagout/ 2>/dev/null || true
          cp /tmp/emulator.log diagout/ 2>/dev/null || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke-diagnostics
          path: diagout/
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo '## Real-engine on-device smoke (x86_64 emulator)'
            echo ""
            echo "- Engine run: ${{ steps.resolve.outputs.run_id }} @ ${{ steps.resolve.outputs.head_sha }}"
            echo "- Device: $(tr '\n' ' ' < /tmp/device_identity.txt 2>/dev/null || echo 'n/a')"
            echo ""
            if [ -f /tmp/smoke_output.txt ]; then
              echo '```'
              cat /tmp/smoke_output.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
