name: Build Krita Brush Engine (real source)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/krita-build.yml'

concurrency:
  group: krita-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Clone krita-source (real Krita v6.0.4, unmodified)
        run: |
          git clone --depth 1 --branch main \
            "https://x-access-token:${{ secrets.KRITA_SOURCE_TOKEN }}@github.com/koenigsegggjesk0o/krita.git" \
            /tmp/krita-repo
          cp -r /tmp/krita-repo/krita-source /opt/krita
          cd /opt/krita
          echo "=== Real Krita source verified ==="
          echo "C++ files: $(find . -name '*.cpp' -o -name '*.h' -o -name '*.cc' | wc -l)"
          grep "KRITA_VERSION_STRING" CMakeLists.txt | head -2

      - name: Clone bridge sources (app repo, feather-krita-flutter)
        run: |
          git clone --depth 1 --branch feather-krita-flutter \
            "https://x-access-token:${{ secrets.KRITA_SOURCE_TOKEN }}@github.com/koenigsegggjesk0o/krita.git" \
            /tmp/fkr-app
          mkdir -p /opt/bridge
          cp /tmp/fkr-app/native/krita_bridge/krita_bridge.h        /opt/bridge/
          cp /tmp/fkr-app/native/krita_bridge/krita_bridge_real.cpp /opt/bridge/
          cp /tmp/fkr-app/native/krita_bridge/smoke_test_real.cpp   /opt/bridge/
          echo "=== Bridge sources ==="
          ls -la /opt/bridge/
          grep -c "extern \"C\"" /opt/bridge/krita_bridge.h

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git pkg-config extra-cmake-modules \
            qt6-base-dev qt6-tools-dev qt6-svg-dev libqt6opengl6-dev qt6-base-private-dev \
            qtbase5-dev qtbase5-private-dev qttools5-dev qttools5-dev-tools \
            libkf5config-dev libkf5widgetsaddons-dev libkf5completion-dev \
            libkf5coreaddons-dev libkf5guiaddons-dev libkf5i18n-dev \
            libkf5itemviews-dev libkf5itemmodels-dev libkf5xmlgui-dev \
            libkf5configwidgets-dev libkf5iconthemes-dev libkf5service-dev \
            libkf5windowsystem-dev libkf5notifications-dev libkf5parts-dev \
            libkf5plotting-dev libkf5kdelibs4support-dev libkf5crash-dev \
            libkf5archive-dev libkf5sonnet-dev libkf5kio-dev libqt5svg5 \
            libboost-dev libboost-system-dev libboost-filesystem-dev \
            libeigen3-dev libexiv2-dev libfftw3-dev libgsl-dev \
            liblcms2-dev libopenexr-dev libilmbase-dev \
            libquazip5-dev libquazip1-qt5-dev \
            libgif-dev libheif-dev libjpeg-dev libpng-dev libtiff-dev \
            libraw-dev libwebp-dev libpoppler-qt6-dev libpoppler-cpp-dev \
            python3 python3-pyqt5 pyqt5-dev-tools python3-sip-dev \
            libglm-dev libmypaint-dev libjson-c-dev intltool \
            libxi-dev libxt-dev libxext-dev libx11-dev \
            libfreetype-dev libfontconfig1-dev libharfbuzz-dev \
            libopengl-dev libegl-dev libopenjp2-7-dev libturbojpeg0-dev \
            libunibreak-dev libraqm-dev \
            qtdeclarative5-dev libqt5quickcontrols2-5 qtquickcontrols2-5-dev \
            qml-module-qtquick-controls2 qml-module-qtquick2 qml-module-qtquick-layouts

      - name: Install Catch2 + Zug + immer + lager + xsimd
        run: |
          git clone --depth 1 --branch v3.5.2 https://github.com/catchorg/Catch2.git /tmp/catch2
          cd /tmp/catch2 && cmake -S . -B build -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTING=OFF && sudo cmake --build build --target install -j$(nproc)
          git clone --depth 1 https://github.com/arximboldi/zug.git /tmp/zug
          cd /tmp/zug && cmake -S . -B build -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF -DBUILD_DOCS=OFF && sudo cmake --build build --target install -j$(nproc)
          git clone --depth 1 https://github.com/arximboldi/immer.git /tmp/immer
          cd /tmp/immer && cmake -S . -B build -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF -DBUILD_DOCS=OFF -DBUILD_BENCHMARKS=OFF && sudo cmake --build build --target install -j$(nproc)
          git clone --depth 1 https://github.com/arximboldi/lager.git /tmp/lager
          cd /tmp/lager && cmake -S . -B build -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_TESTING=OFF -Dlager_BUILD_TESTS=OFF -Dlager_BUILD_FAILURE_TESTS=OFF \
            -Dlager_BUILD_EXAMPLES=OFF -Dlager_BUILD_DEBUGGER_EXAMPLES=OFF \
            -Dlager_BUILD_DOCS=OFF -Dlager_EMBED_RESOURCES_PATH=OFF \
            && sudo cmake --build build --target install -j$(nproc)
          git clone --depth 1 --branch 13.0.0 https://github.com/xtensor-stack/xsimd.git /tmp/xsimd
          cd /tmp/xsimd && cmake -S . -B build -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTING=OFF && sudo cmake --build build --target install -j$(nproc)

      - name: Configure (real Krita source, unmodified)
        run: |
          cd /opt/krita
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/opt/krita-install \
            -DBUILD_TESTING=OFF -DENABLE_PYTHON=OFF \
            -DWITH_QT6=OFF -DQT_MAJOR_VERSION=5 \
            -DWITH_HEIF=OFF -DWITH_JPEG=ON -DWITH_PNG=ON -DWITH_TIFF=ON \
            -DWITH_RAW=OFF -DWITH_GIF=OFF -DWITH_FFTW3=OFF -DWITH_OPENEXR=OFF \
            -DWITH_KDE=ON -DWITH_XCF=OFF -DWITH_SOPRANO=OFF -DWITH_HDR=OFF \
            -DWITH_WEBP=OFF -DWITH_JXL=OFF -DWITH_OCIO=OFF \
            -DWITH_OPENJPEG=OFF -DWITH_MEDIA=OFF \
            -G Ninja 2>&1 | tail -80

      - name: Build brush engine libs (kritaimage + kritalibbrush + deps)
        run: |
          set -o pipefail
          cd /opt/krita
          cmake --build build --target kritaimage kritalibbrush --parallel 2 2>&1 | tail -300
          echo "=== Brush engine .so files ==="
          find build -name "libkrita*.so*" 2>/dev/null | head -40

      - name: Collect .so (stripped, real files)
        if: always()
        run: |
          mkdir -p artifact/lib artifact/bin
          find /opt/krita/build -name "libkrita*.so*" 2>/dev/null | while read f; do
            cp -L "$f" "artifact/lib/$(basename "$f")"
          done
          strip --strip-unneeded artifact/lib/libkrita*.so* 2>/dev/null || true
          ls artifact/lib/ | wc -l
          du -sh artifact/lib

      - name: Build real bridge (libkrita_bridge_real.so) + smoke test
        run: |
          KRITA=/opt/krita
          BUILD=$KRITA/build
          mkdir -p artifact/lib artifact/bin
          INC=""
          for d in $(find $KRITA/libs -maxdepth 2 -type d) $(find $BUILD/libs -maxdepth 2 -type d) $BUILD; do
            INC="$INC -I$d"
          done
          QT5=/usr/include/x86_64-linux-gnu/qt5
          INC="$INC -I$QT5 -I$QT5/QtCore -I$QT5/QtGui -I$QT5/QtXml"
          # Bulletproof: reuse the exact include flags CMake configured for
          # libs/brush (boost, Qt5, lager, build-dir generated headers).
          KRITAINCS=$(cd $BUILD && ninja -t commands kritalibbrush 2>/dev/null | grep 'KisBrushModel' | grep -m1 -o '\-I[^ ]*' | sort -u | head -80 | tr '\n' ' ')
          if [ -z "$KRITAINCS" ]; then
            KRITAINCS=$(cd $BUILD && ninja -t commands kritalibbrush 2>/dev/null | grep -m1 -o '\-I[^ ]*' | sort -u | head -80 | tr '\n' ' ')
          fi
          echo "Krita include dirs extracted: $(echo $KRITAINCS | wc -w)"
          INC="$INC $KRITAINCS"
          # Nuclear option: every include dir CMake configured anywhere.
          ALLINCS=$(cd $BUILD && ninja -t commands 2>/dev/null | grep -o '\-I[^ ]*' | sort -u | head -500 | tr '\n' ' ')
          echo "full-graph include dirs: $(echo $ALLINCS | wc -w)"
          INC="$INC $ALLINCS"
          # OpenEXR half.h (HAVE_OPENEXR is on in the generated KoConfig.h).
          HALFD=$(find /usr/include -name 'half.h' 2>/dev/null | head -5)
          for f in $HALFD; do INC="$INC -I$(dirname "$f")"; done
          INC="$INC -I/usr/include/OpenEXR -I/usr/include/Imath -I/usr/include/eigen3"
          # Decisive fallback: locate klocalizedstring.h on disk wherever it is.
          KLOC=$(find /usr/include /usr/local/include -name 'klocalizedstring.h' 2>/dev/null | head -3)
          for f in $KLOC; do INC="$INC -I$(dirname "$f")"; done
          echo "=== Compiling libkrita_bridge_real.so (thin glue over real Krita classes) ==="
          g++ -std=c++17 -shared -fPIC -O2 -fno-operator-names $INC \
            /opt/bridge/krita_bridge_real.cpp \
            -Lartifact/lib \
            -lkritalibbrush -lkritaimage -lkritapigment -lkritaresources -lkritastore \
            -lkritacommand -lkritaglobal -lkritaversion -lkritaflake -lkritaplugin \
            -lKF5I18n -lQt5Core -lQt5Gui -lQt5Xml -lz \
            -Wl,-rpath,'$ORIGIN' \
            -o artifact/lib/libkrita_bridge_real.so
          echo "=== Compiling smoke test (link also verifies the bridge's full symbol closure) ==="
          g++ -std=c++17 -O2 $INC \
            /opt/bridge/smoke_test_real.cpp \
            -Lartifact/lib -lkrita_bridge_real \
            -lkritalibbrush -lkritaimage -lkritapigment -lkritaresources \
            -lkritaglobal -lkritaversion -lKF5I18n -lQt5Core -lQt5Gui -lQt5Xml -lz \
            -Wl,-rpath,'$ORIGIN/../lib' \
            -o artifact/bin/smoke_test_real
          echo "=== Running REAL-engine smoke test (rpath only) ==="
          ./artifact/bin/smoke_test_real

      - name: Upload brush engine libs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krita-brush-engine
          path: artifact/
          retention-days: 90

      - name: Summary
        if: always()
        run: |
          echo "## Real Krita Brush Engine Build" >> $GITHUB_STEP_SUMMARY
          echo "Source: real Krita v6.0.4 (unmodified, from krita-source/)" >> $GITHUB_STEP_SUMMARY
          if [ -f artifact/lib/libkrita_bridge_real.so ]; then
            echo "### Bridge: libkrita_bridge_real.so built against real libkrita* libs" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -d artifact/lib ] && ls artifact/lib/libkrita*.so* 2>/dev/null | grep -q .; then
            echo "### SUCCESS" >> $GITHUB_STEP_SUMMARY
            ls -lh artifact/lib/ >> $GITHUB_STEP_SUMMARY
          else
            echo "### FAILED — no .so files produced" >> $GITHUB_STEP_SUMMARY
          fi

  # ---------------------------------------------------------------------
  # Windows (MSVC x64) build of the SAME real engine, loop-34 (roadmap b).
  # Unmodified krita-source -> kritaimage + kritalibbrush via MSVC/Ninja,
  # thin krita_bridge_real.cpp glue as krita_bridge_real.dll, C++ smoke.
  # Dependencies: Qt 5.15.2 (aqtinstall), KF5 v5.116.0 built from official
  # KDE sources (ECM + the 7 frameworks Krita's CMakeLists REQUIRES:
  # kconfig kwidgetsaddons kcompletion kcoreaddons kguiaddons ki18n
  # kitemviews, plus karchive for KoStore), vcpkg for gettext/zlib/bzip2/
  # lcms2/eigen3/exiv2/freetype/harfbuzz/fontconfig/libunibreak/boost.
  # Krita source tree is NEVER modified — dependency provisioning only.
  # ---------------------------------------------------------------------
  build-windows-engine:
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      QTDIR: C:/Qt/5.15.2/msvc2019_64
      KF5DIR: C:/kf5
      KFTAG: v5.116.0
      VCPKG_DEFAULT_TRIPLET: x64-windows
    steps:
      - uses: actions/checkout@v4

      - name: Enable MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Iteration-speed caches (loop-34): vcpkg installed tree + KF5 build
      # tree are stable across runs (port list / KFTAG pinned); the krita
      # build tree enables ninja-incremental rebuilds between workflow fixes.
      # Bump the -vN suffix when the port list / KFTAG / cmake options change.
      - name: Restore dependency caches (vcpkg installed + KF5)
        uses: actions/cache/restore@v4
        with:
          path: |
            C:/vcpkg2/installed
            C:/kf5
            C:/kf5-src
            C:/kf5-build
          key: winengine-deps-v10
          restore-keys: winengine-deps-

      - name: Restore krita build tree (ninja incremental)
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/build
          key: winengine-krbuild-v3
          restore-keys: winengine-krbuild-

      - name: Clone krita-source (real Krita v6.0.4, unmodified)
        run: |
          git clone --depth 1 --branch main \
            "https://x-access-token:${{ secrets.KRITA_SOURCE_TOKEN }}@github.com/koenigsegggjesk0o/krita.git" \
            /tmp/krita-repo
          # Windows git-bash cannot create Linux symlinks (cp -r preserves
          # them and then fails). Strip them from the TEMP build checkout
          # only — the krita repo itself is untouched; the engine build
          # needs none of the symlinked packaging scaffolding.
          find /tmp/krita-repo/krita-source -type l -delete
          cp -r /tmp/krita-repo/krita-source "$GITHUB_WORKSPACE/krita"
          cd "$GITHUB_WORKSPACE/krita"
          echo "=== Real Krita source verified ==="
          grep "KRITA_VERSION_STRING" CMakeLists.txt | head -2

      - name: Clone bridge sources (app repo, feather-krita-flutter)
        run: |
          git clone --depth 1 --branch feather-krita-flutter \
            "https://x-access-token:${{ secrets.KRITA_SOURCE_TOKEN }}@github.com/koenigsegggjesk0o/krita.git" \
            /tmp/fkr-app
          mkdir -p "$GITHUB_WORKSPACE/bridge"
          cp /tmp/fkr-app/native/krita_bridge/krita_bridge.h        "$GITHUB_WORKSPACE/bridge/"
          cp /tmp/fkr-app/native/krita_bridge/krita_bridge_real.cpp "$GITHUB_WORKSPACE/bridge/"
          cp /tmp/fkr-app/native/krita_bridge/smoke_test_real.cpp   "$GITHUB_WORKSPACE/bridge/"
          ls -la "$GITHUB_WORKSPACE/bridge/"

      - name: Install Qt 5.15.2 (win64_msvc2019_64) via aqtinstall
        run: |
          python -m pip install --quiet aqtinstall
          # qtsvg ships INSIDE the 5.15 base package. Trim the download to
          # the archives Krita's configure actually needs (Qt5 REQUIRED
          # components are all in qtbase; qmlmodules needs qtdeclarative)
          # — smaller download, less exposure to flaky mirrors. Retry x3
          # against transient Bad7zFile mirror corruption.
          for i in 1 2 3; do
            rm -rf 'C:/Qt'
            aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -O 'C:/Qt' \
              --archives qtbase qtdeclarative qtquickcontrols2 qttools qtsvg qttranslations qtwinextras && break
            echo "aqt attempt $i failed; retrying in 15s"; sleep 15
          done
          test -f "$QTDIR/bin/Qt5Core.dll" || { echo 'FATAL: Qt5Core.dll missing'; exit 1; }
          test -f "$QTDIR/bin/Qt5Svg.dll" || { echo 'FATAL: Qt5Svg.dll missing'; exit 1; }
          test -f "$QTDIR/bin/Qt5WinExtras.dll" || { echo 'FATAL: Qt5WinExtras.dll missing'; exit 1; }
          echo "Qt installed: $QTDIR"

      - name: Bootstrap fresh vcpkg (runner's C:\vcpkg has a pruned ports tree — lcms2 missing)
        run: |
          # Merge-safe: the Actions cache restores C:/vcpkg2/installed (a
          # subdir), so the clone target may be non-empty — clone to a temp
          # dir and merge the repo over it, preserving the cached installed/.
          if [ ! -x 'C:/vcpkg2/vcpkg.exe' ]; then
            rm -rf 'C:/vcpkg2-tmp'
            git clone --depth 1 --branch 2025.06.13 https://github.com/microsoft/vcpkg.git 'C:/vcpkg2-tmp'
            mkdir -p 'C:/vcpkg2'
            cp -a 'C:/vcpkg2-tmp/.' 'C:/vcpkg2/'
            rm -rf 'C:/vcpkg2-tmp'
            'C:/vcpkg2/bootstrap-vcpkg.bat' -disableMetrics
          fi
          test -x 'C:/vcpkg2/vcpkg.exe' || { echo 'FATAL: vcpkg bootstrap failed'; exit 1; }
          echo 'vcpkg2 bootstrapped'

      - name: vcpkg engine deps (gettext zlib bzip2 lcms eigen3 exiv2 freetype harfbuzz fontconfig libunibreak boost)
        run: |
          # NOTE: call our vcpkg.exe explicitly — the image's C:\vcpkg lacks
          # many ports and msvc-dev-cmd overrides VCPKG_ROOT to the VS copy.
          'C:/vcpkg2/vcpkg.exe' install --triplet x64-windows \
            'gettext[tools]' zlib bzip2 lcms eigen3 exiv2 tiff fribidi \
            freetype harfbuzz fontconfig libunibreak \
            boost-multi-array boost-icl boost-rational boost-utility boost-integer boost-accumulators boost-circular-buffer boost-heap boost-math boost-intrusive boost-polygon boost-geometry boost-graph boost-property-tree boost-random boost-format boost-function pkgconf gsl
          test -d 'C:/vcpkg2/installed/x64-windows/lib' || { echo 'FATAL: vcpkg install failed'; exit 1; }
          # ki18n's KF5I18nMacros find_package(Gettext) needs msgfmt/msgmerge
          # executables from the gettext[tools] feature on PATH:
          test -f 'C:/vcpkg2/installed/x64-windows/tools/gettext/bin/msgfmt.exe' \
            || { echo 'FATAL: msgfmt.exe missing (gettext[tools] not installed?)'; exit 1; }

      - name: Build ECM (extra-cmake-modules)
        run: |
          mkdir -p C:/kf5-src C:/kf5-build
          [ -d C:/kf5-src/ECM ] || git clone --depth 1 --branch "$KFTAG" https://invent.kde.org/frameworks/extra-cmake-modules.git C:/kf5-src/ECM
          cmake -S C:/kf5-src/ECM -B C:/kf5-build/build-ecm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$KF5DIR" -DBUILD_TESTING=OFF
          cmake --build C:/kf5-build/build-ecm
          cmake --install C:/kf5-build/build-ecm

      - name: Build KF5 frameworks (kcoreaddons karchive kconfig ki18n kguiaddons kwidgetsaddons kcompletion kitemviews)
        run: |
          export PATH="C:/vcpkg2/installed/x64-windows/tools/gettext/bin:$PATH"
          TCF='C:/vcpkg2/scripts/buildsystems/vcpkg.cmake'
          PREFIX="$KF5DIR;$QTDIR;C:/vcpkg2/installed/x64-windows"
          for fw in kcoreaddons karchive kconfig ki18n kguiaddons kwidgetsaddons kcompletion kitemviews kwindowsystem kcodecs kauth kconfigwidgets kiconthemes kxmlgui; do
            echo "=== KF5 framework: $fw ==="
            [ -d "C:/kf5-src/KF5-$fw" ] || git clone --depth 1 --branch "$KFTAG" "https://invent.kde.org/frameworks/$fw.git" "C:/kf5-src/KF5-$fw"
            cmake -S "C:/kf5-src/KF5-$fw" -B "C:/kf5-build/build-$fw" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$KF5DIR" \
              -DCMAKE_PREFIX_PATH="$PREFIX" \
              -DCMAKE_TOOLCHAIN_FILE="$TCF" \
              -DVCPKG_TARGET_TRIPLET=x64-windows \
              -DBUILD_TESTING=OFF -DBUILD_HTML_DOCS=OFF -DBUILD_QTHELP_DOCS=OFF -DBUILD_DESIGNERPLUGIN=OFF \
              -DKF_IGNORE_PLATFORM_CHECK=TRUE
            cmake --build "C:/kf5-build/build-$fw" --parallel
            cmake --install "C:/kf5-build/build-$fw"
          done
          test -f "$KF5DIR/lib/cmake/KF5I18n/KF5I18nConfig.cmake" || { echo 'FATAL: KF5I18n not installed'; exit 1; }

      - name: Install immer + zug + xsimd + lager (Krita 6 configure requires them; same sources as the Linux job)
        run: |
          export PATH="C:/vcpkg2/installed/x64-windows/tools/gettext/bin:$PATH"
          P="$KF5DIR"
          mkdir -p C:/kf5-src C:/kf5-build
          [ -d C:/kf5-src/immer ] || git clone --depth 1 https://github.com/arximboldi/immer.git C:/kf5-src/immer
          cmake -S C:/kf5-src/immer -B C:/kf5-build/build-immer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$P" -DBUILD_TESTING=OFF -Dimmer_BUILD_TESTS=OFF -Dimmer_BUILD_PERSIST_TESTS=OFF -Dimmer_BUILD_EXAMPLES=OFF -Dimmer_BUILD_DOCS=OFF -Dimmer_BUILD_EXTRAS=OFF -Dimmer_BUILD_BENCHMARKS=OFF
          cmake --build C:/kf5-build/build-immer && cmake --install C:/kf5-build/build-immer
          [ -d C:/kf5-src/zug ] || git clone --depth 1 https://github.com/arximboldi/zug.git C:/kf5-src/zug
          cmake -S C:/kf5-src/zug -B C:/kf5-build/build-zug -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$P" -DBUILD_TESTING=OFF -Dzug_BUILD_TESTS=OFF -Dzug_BUILD_EXAMPLES=OFF -Dzug_BUILD_DOCS=OFF
          cmake --build C:/kf5-build/build-zug && cmake --install C:/kf5-build/build-zug
          [ -d C:/kf5-src/xsimd ] || git clone --depth 1 --branch 13.0.0 https://github.com/xtensor-stack/xsimd.git C:/kf5-src/xsimd
          cmake -S C:/kf5-src/xsimd -B C:/kf5-build/build-xsimd -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$P" -DBUILD_TESTING=OFF -DBUILD_TESTS=OFF
          cmake --build C:/kf5-build/build-xsimd && cmake --install C:/kf5-build/build-xsimd
          [ -d C:/kf5-src/lager ] || git clone --depth 1 https://github.com/arximboldi/lager.git C:/kf5-src/lager
          cmake -S C:/kf5-src/lager -B C:/kf5-build/build-lager -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$P" -DBUILD_TESTING=OFF -Dlager_BUILD_TESTS=OFF -Dlager_BUILD_FAILURE_TESTS=OFF -Dlager_BUILD_EXAMPLES=OFF -Dlager_BUILD_DEBUGGER_EXAMPLES=OFF -Dlager_BUILD_DOCS=OFF -Dlager_EMBED_RESOURCES_PATH=OFF
          cmake --build C:/kf5-build/build-lager && cmake --install C:/kf5-build/build-lager
          test -f "$KF5DIR/share/cmake/Immer/ImmerConfig.cmake" -o -f "$KF5DIR/lib/cmake/Immer/ImmerConfig.cmake" -o -f "$KF5DIR/share/immer/ImmerConfig.cmake" || { echo 'FATAL: Immer config not found after install'; find "$KF5DIR" -name 'ImmerConfig.cmake'; exit 1; }

      - name: Build QuaZip v1.4 against aqt Qt (vcpkg quazip would drag a full qtbase build — hours)
        run: |
          mkdir -p C:/kf5-src C:/kf5-build
          [ -d C:/kf5-src/quazip ] || git clone --depth 1 --branch v1.4 https://github.com/stachenov/quazip.git C:/kf5-src/quazip
          cmake -S C:/kf5-src/quazip -B C:/kf5-build/build-quazip -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$KF5DIR" \
            -DCMAKE_PREFIX_PATH="$QTDIR;C:/vcpkg2/installed/x64-windows" \
            -DCMAKE_TOOLCHAIN_FILE='C:/vcpkg2/scripts/buildsystems/vcpkg.cmake' \
            -DVCPKG_TARGET_TRIPLET=x64-windows \
            -DQUAZIP_QT_MAJOR_VERSION=5 -DBUILD_TESTING=OFF -DQUAZIP_BUILD_TESTS=OFF
          cmake --build C:/kf5-build/build-quazip && cmake --install C:/kf5-build/build-quazip
          find "$KF5DIR" -name 'QuaZip-Qt5*Config.cmake' | head -3
          test -n "$(find "$KF5DIR" -name 'QuaZip-Qt5*Config.cmake' | head -1)" || { echo 'FATAL: QuaZip-Qt5 config not installed'; exit 1; }

      - name: Write qMin overload shim (flag-level fix for Qt5 mixed-type qMin)
        run: |
          # loop-35 fix45g Plan B: Qt5 containers' size()=int vs ptrdiff_t on
          # Win64 makes upstream qMin(int, long long) a hard template
          # deduction error (KoZoomActionState.cpp — upstream only builds
          # this TU under Qt6). The /FI shim below adds an enable_if'd
          # two-type qMin overload — same-type calls still resolve to Qt's
          # own template, so semantics are untouched. Krita source untouched.
          cat > "$GITHUB_WORKSPACE/qmin_shim.h" << 'EOH'
          #include <type_traits>
          template <typename A, typename B,
                    typename = std::enable_if_t<!std::is_same<A, B>::value>>
          constexpr auto qMin(const A &a, const B &b) -> decltype(true ? (a) : (b)) {
            return a < b ? a : b;
          }
          EOH
          ls -la "$GITHUB_WORKSPACE/qmin_shim.h"

      - name: Configure Krita (minimal engine build, Qt5, MSVC, unmodified source)
        run: |
          export PATH="C:/vcpkg2/installed/x64-windows/tools/gettext/bin:$PATH"
          # stale CMakeCache entries poison re-configures (e.g. GETTEXT executables cached NOTFOUND)
          rm -f "$GITHUB_WORKSPACE/build/CMakeCache.txt"
          # Krita's custom FindLibExiv2/Find modules get their versions via
          # pkg-config first; the runner has no pkg-config and vcpkg's .pc
          # files are not on PKG_CONFIG_PATH by default.
          # Strawberry Perl ships a broken pkg-config perl script that
          # shadows real pkg-config on PATH — use vcpkg's pkgconf binary
          # explicitly instead.
          export PKG_CONFIG_PATH='C:/vcpkg2/installed/x64-windows/lib/pkgconfig;C:/vcpkg2/installed/x64-windows/share/pkgconfig'
          test -x 'C:/vcpkg2/installed/x64-windows/tools/pkgconf/pkgconf.exe' || { echo 'FATAL: pkgconf.exe missing (pkgconf port not installed?)'; exit 1; }
          'C:/vcpkg2/installed/x64-windows/tools/pkgconf/pkgconf.exe' --modversion exiv2 || { echo 'FATAL: pkgconf cannot find exiv2 .pc'; exit 1; }
          # RED LINE (loop-35 fix42): the krita source tree is NEVER modified.
          # The former MSVC compat shims were dllexport-forced-instantiation
          # artifacts; neutralized here via workflow-level compiler flags
          # instead: export every krita lib's symbol table through
          # WINDOWS_EXPORT_ALL_SYMBOLS and pre-define each export macro EMPTY
          # so no TU compiles dllexport/dllimport semantics (which force
          # eager member instantiation on incomplete pimpl/adapter types).
          EMPTY_EXPORTS="-DKRITAGLOBAL_EXPORT= -DKRITAIMAGE_EXPORT= -DKRITAPIGMENT_EXPORT= -DKRITARESOURCES_EXPORT= -DKRITASTORE_EXPORT= -DKRITAPSDUTILS_EXPORT= -DKRITAMETADATA_EXPORT= -DKRITACOMMAND_EXPORT= -DKRITAMULTIARCH_EXPORT= -DKRITAVERSION_EXPORT= -DBRUSH_EXPORT= -DKRITAPLUGIN_EXPORT= -DKRITAWIDGETS_EXPORT= -DKRITAWIDGETUTILS_EXPORT= -DKRITAFLAKE_EXPORT= -DKRITACOMMON_EXPORT= -DKRITARESOURCEWIDGETS_EXPORT= /FI$GITHUB_WORKSPACE/qmin_shim.h"
          cmake -S "$GITHUB_WORKSPACE/krita" -B "$GITHUB_WORKSPACE/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON \
            -DCMAKE_CXX_FLAGS="$EMPTY_EXPORTS" \
            -DBUILD_TESTING=OFF -DENABLE_PYTHON=OFF \
            -DWITH_QT6=OFF \
            -DWITH_HEIF=OFF -DWITH_JPEG=OFF -DWITH_PNG=OFF -DWITH_TIFF=OFF \
            -DWITH_RAW=OFF -DWITH_GIF=OFF -DWITH_FFTW3=OFF -DWITH_OPENEXR=OFF \
            -DWITH_KDE=ON -DWITH_XCF=OFF -DWITH_SOPRANO=OFF -DWITH_HDR=OFF \
            -DWITH_WEBP=OFF -DWITH_JXL=OFF -DWITH_OCIO=OFF \
            -DWITH_OPENJPEG=OFF -DWITH_MEDIA=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_LibMyPaint=TRUE \
            -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_C_COMPILER=clang-cl \
            -DPKG_CONFIG_EXECUTABLE='C:/vcpkg2/installed/x64-windows/tools/pkgconf/pkgconf.exe' \
            -DGETTEXT_MSGFMT_EXECUTABLE='C:/vcpkg2/installed/x64-windows/tools/gettext/bin/msgfmt.exe' \
            -DGETTEXT_MSGMERGE_EXECUTABLE='C:/vcpkg2/installed/x64-windows/tools/gettext/bin/msgmerge.exe' \
            -DCMAKE_PREFIX_PATH="$KF5DIR;$QTDIR;C:/vcpkg2/installed/x64-windows" \
            -DCMAKE_TOOLCHAIN_FILE='C:/vcpkg2/scripts/buildsystems/vcpkg.cmake' \
            -DVCPKG_TARGET_TRIPLET=x64-windows 2>&1 | tail -100
          grep -m2 'CMAKE_PREFIX_PATH\|ECM_DIR' "$GITHUB_WORKSPACE/build/CMakeCache.txt" || echo 'DIAG: no prefix entries in CMakeCache'


      - name: Prune per-lib DLL link edges from build.ninja (objects are the deliverable)
        run: |
          cd "$GITHUB_WORKSPACE/build"
          # loop-35 fix44: CMake's ninja graph makes object edges transitively
          # depend on the per-lib DLL links (via AutoGen chains), so a single
          # failing DLL link (cross-DLL static-data imports) stalls the whole
          # build. We never consume those DLLs — the bridge step merges ALL
          # objects into ONE engine DLL — so the link edges are surgically
          # removed here: pure workflow tooling, krita source untouched.
          python - << 'PYEOF'
          data = open('build.ninja','rb').read().decode('latin-1')
          data = data.replace('\r\n', '\n')
          blocks = data.split('\n\n')
          kept = []
          dropped = 0
          for b in blocks:
              if not b.strip():
                  continue
              lines = b.split('\n')
              first = lines[0]
              if first.startswith('build '):
                  outputs = first.split(':', 1)[0].split()
                  if any(o.endswith('.dll') or o.endswith('.lib') for o in outputs):
                      dropped += 1
                      continue
              nb = []
              for l in lines:
                  toks = l.split(' ')
                  toks = [t for t in toks if not (t.endswith('.dll') or t.endswith('.lib') or t.endswith('.exp'))]
                  nb.append(' '.join(toks))
              kept.append('\n'.join(nb))
          open('build.ninja','wb').write(('\n\n'.join(kept) + '\n').encode('latin-1'))
          print('dropped link edges:', dropped, '| kept blocks:', len(kept))
          # verify: no build edge may still reference dll/lib/exp tokens
          bad = [l for l in open('build.ninja','rb').read().decode('latin-1').split('\n')
                 if l.startswith('build ') and any(t.endswith(('.dll','.lib','.exp')) for t in l.split(' '))]
          print('lines still referencing dll/lib:', len(bad))
          for l in bad[:5]: print('  BAD:', l[:120])
          if bad:
              raise SystemExit(3)
          PYEOF
          test "$?" -eq 0 || { echo 'FATAL: build.ninja surgery failed'; exit 1; }

      - name: Build brush engine OBJECTS (kritaimage + kritalibbrush closure)
        run: |
          cd "$GITHUB_WORKSPACE/build"
          # loop-35 fix43/fix44/fix44c DESIGN: we never consume the per-lib
          # krita*.dll — link edges are pruned (previous step) and the bridge
          # step merges ALL objects into ONE engine DLL. Objects are built
          # directly by their explicit ninja outputs (bypasses the phony
          # alias chains whose behavior surprised us in fix44b). -k 0 keeps
          # one bad TU from blocking the rest; the object gates below catch
          # under-production. Krita source remains untouched.
          # loop-35 fix45: EXPLICIT closure target list — the previous
          # forward-slash grep silently matched nothing, the empty list made
          # xargs run bare `ninja -k 0` (building the ENTIRE 2621-target
          # graph incl. app+plugins!). Target-dir names match both / and \
          # paths via the CMakeFiles.(x).dir pattern.
          OBJS=$(ninja -t targets all | grep -E '\.obj:' \
            | grep -E 'CMakeFiles.(kritaimage|kritalibbrush|kritapigment|kritaresources|kritastore|kritaglobal|kritawidgets|kritawidgetutils|kritaflake|kritapsdutils|kritametadata|kritacommand|kritamultiarch|kritaversion|kritaplugin|kritaresourcewidgets|libraqm)(_autogen)?\.dir' \
            | cut -d: -f1)
          NOBJS_PLAN=$(printf '%s\n' "$OBJS" | wc -l)
          echo "objects planned: $NOBJS_PLAN"
          [ "$NOBJS_PLAN" -gt 700 ] || { echo 'FATAL: object plan too small - filter mismatch?'; printf '%s\n' "$OBJS" | head -5; exit 1; }
          printf '%s\n' "$OBJS" | xargs -n 80 ninja -k 0 2>&1 | tail -40 || true
          NOBJS=$(find . -name '*.obj' | wc -l)
          echo "krita objects built: $NOBJS"
          [ "$NOBJS" -gt 700 ] || { echo 'FATAL: too few objects built (compile errors?)'; exit 1; }
          [ -n "$(find . -name 'kis_auto_brush.cpp.obj' | head -1)" ] || { echo 'FATAL: kis_auto_brush.cpp.obj missing'; exit 1; }
          [ -n "$(find . -name 'KoXmlNS.cpp.obj' | head -1)" ] || { echo 'FATAL: KoXmlNS.cpp.obj missing'; exit 1; }
          [ -n "$(find . -path '*CMakeFiles/libraqm.dir*' -name 'raqm.c.obj' | head -1)" ] || { echo 'FATAL: vendored raqm.c.obj missing'; exit 1; }
          echo 'object gates OK'

      - name: Build merged real-engine DLL (all krita objects + bridge glue) + smoke test
        run: |
          export MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL='*'
          export PATH="C:/vcpkg2/installed/x64-windows/tools/gettext/bin:$PATH"
          WS="$GITHUB_WORKSPACE"
          BUILD="$WS/build"
          QT="$QTDIR"
          KF5="$KF5DIR"
          VP='C:/vcpkg2/installed/x64-windows'
          mkdir -p artifact/lib artifact/bin
          # ---- include dirs: reuse the exact flags CMake configured for kritalibbrush
          # fix45: grep -m1 + || true — pipefail + -e killed the whole step
          # silently in fix44c when this pipeline tripped SIGPIPE.
          # fix45b: ask for the OBJ FILE directly — the target alias chain was
          # emptied by the link-edge prune (dll/lib inputs stripped), so
          # -t commands <target> legitimately returns nothing.
          BRUSHREL=$(cd "$BUILD" && find libs -name 'KisBrushModel.cpp.obj' | head -1)
          [ -z "$BRUSHREL" ] && BRUSHREL=$(cd "$BUILD" && find libs -name 'kis_auto_brush.cpp.obj' | head -1)
          [ -n "$BRUSHREL" ] || { echo 'FATAL: brush obj not found for include extraction'; exit 1; }
          LINE=$(cd "$BUILD" && ninja -t commands "$BRUSHREL" | tail -1 || true)
          [ -n "$LINE" ] || { echo 'FATAL: no compile command found for' "$BRUSHREL"; exit 1; }
          # fix42: NO embedded double quotes in flags. Bash passes args with
          # literal quote characters straight to clang-cl, so /I"D:\..." was
          # parsed as a path that CONTAINS quote marks (every include dir
          # broken -> 'kis_auto_brush.h' not found despite 192 dirs). Paths
          # here are quote-free (no spaces), so emit bare /I<dir> flags.
          INCS=$(printf '%s' "$LINE" | grep -oE '(/|-)I"[^"]+"|(/|-)I[^ ]+' | sed -E 's#^(/|-)I"?([^"]+)"?$#\2#' | sort -u | head -200 | sed 's#^#/I#' | tr '\n' ' ' || true)
          echo "extracted include dirs: $(printf '%s' "$INCS" | wc -w)"
          # belt-and-braces: every lib subdir + every dir containing generated headers
          LIBD=$(find "$WS/krita/libs" -maxdepth 2 -type d | sed 's#^#/I#' | tr '\n' ' ')
          GEND=$(find "$BUILD" -name '*.h' -exec dirname {} \; | sort -u | head -80 | sed 's#^#/I#' | tr '\n' ' ')
          INCS="$INCS $LIBD $GEND /I$WS/krita /I$BUILD"
          # fix45c: EVERY Qt module + EVERY KF5 framework include subdir.
          # The wrapper TU includes krita headers that reach klocalizedstring.h
          # (KI18n) etc. — CMake's per-target -I set on the extracted brush TU
          # command does NOT cover the transitive closure of consumer headers.
          QTINC=''; KFINC=''
          for d in "$QT/include"/Qt*; do [ -d "$d" ] && QTINC="$QTINC /I$d"; done
          for d in "$KF5/include/KF5"/*/; do [ -d "$d" ] && KFINC="$KFINC /I$d"; done
          INCS="$INCS $QTINC $KFINC"
          echo "total include dirs: $(printf '%s' "$INCS" | wc -w)"
          # ---- collect the CLOSURE krita objects into a rsp (fix45b: the
          # build/libs tree also holds stale objs from earlier over-builds —
          # filter by the same explicit target list as the build step)
          find "$BUILD/libs" "$BUILD/3rdparty_vendor" -name '*.obj' \
            | grep -E 'CMakeFiles.(kritaimage|kritalibbrush|kritapigment|kritaresources|kritastore|kritaglobal|kritawidgets|kritawidgetutils|kritaflake|kritapsdutils|kritametadata|kritacommand|kritamultiarch|kritaversion|kritaplugin|kritaresourcewidgets|libraqm)(_autogen)?\.dir' \
            | sort > "$BUILD/krita_objs.rsp"
          NOBJS=$(wc -l < "$BUILD/krita_objs.rsp")
          echo "merging $NOBJS krita objects into ONE engine DLL"
          # ---- vcpkg import libs (over-link: unused import libs are ignored)
          VPLIBARGS=$(find "$VP/lib" -maxdepth 1 -name '*.lib' -printf '%f ' | tr '\n' ' ')
          echo "vcpkg libs: $VPLIBARGS"
          # ---- KF5-built libs (fix45f: glob ALL of C:/kf5/lib/*.lib —
          # KF5Config installs KF5ConfigCore+KF5ConfigGui, not KF5Config;
          # also catches quazip1-qt5.lib; lager is header-only)
          KFLIBS=$(find "$KF5/lib" -maxdepth 1 -name '*.lib' -printf '%f ' | tr '\n' ' ')
          echo "kf5 libs: $KFLIBS"
          # ---- merged engine DLL = bridge glue + all krita objects.
          # Objects were compiled with EMPTY krita export macros, so all
          # cross-object references are direct and resolve inside this one
          # image — no dllimport needed anywhere. Only the extern "C" ABI
          # (KRITA_BRIDGE_API dllexport in krita_bridge.h) is exported.
          clang-cl /nologo /std:c++17 /EHsc /O2 /MD /Zc:__cplusplus /permissive \
            -DKRITAGLOBAL_EXPORT= -DKRITAIMAGE_EXPORT= -DKRITAPIGMENT_EXPORT= -DKRITARESOURCES_EXPORT= \
            -DKRITASTORE_EXPORT= -DKRITAPSDUTILS_EXPORT= -DKRITAMETADATA_EXPORT= -DKRITACOMMAND_EXPORT= \
            -DKRITAMULTIARCH_EXPORT= -DKRITAVERSION_EXPORT= -DBRUSH_EXPORT= -DKRITAPLUGIN_EXPORT= \
            -DKRITAWIDGETS_EXPORT= -DKRITAWIDGETUTILS_EXPORT= -DKRITAFLAKE_EXPORT= \
            $INCS \
            /I"$QT/include" \
            /I"$KF5/include" /I"$VP/include" \
            "$WS/bridge/krita_bridge_real.cpp" \
            "@$BUILD/krita_objs.rsp" \
            /LD /Fe:artifact/bin/krita_bridge_real.dll \
            /link /IMPLIB:artifact/lib/krita_bridge_real.lib /LIBPATH:"$QT/lib" /LIBPATH:"$KF5/lib" /LIBPATH:"$VP/lib" \
            Qt5Core.lib Qt5Gui.lib Qt5Xml.lib Qt5Svg.lib Qt5Widgets.lib Qt5Sql.lib Qt5Concurrent.lib Qt5Network.lib Qt5PrintSupport.lib Qt5WinExtras.lib \
            ole32.lib shell32.lib user32.lib advapi32.lib uuid.lib gdi32.lib \
            $KFLIBS \
            $VPLIBARGS
          # ---- collect runtime DLLs next to the smoke exe (Windows resolves from PATH/artifact dir)
          cp "$QT/bin/Qt5Core.dll" "$QT/bin/Qt5Gui.dll" "$QT/bin/Qt5Xml.dll" \
             "$QT/bin/Qt5Svg.dll" "$QT/bin/Qt5Widgets.dll" "$QT/bin/Qt5Sql.dll" \
             "$QT/bin/Qt5Concurrent.dll" "$QT/bin/Qt5Network.dll" "$QT/bin/Qt5PrintSupport.dll" \
             "$QT/bin/Qt5WinExtras.dll" artifact/bin/
          cp "$KF5/bin/"*.dll artifact/bin/ 2>/dev/null || true
          cp -r "$VP/bin/"*.dll artifact/bin/ 2>/dev/null || true
          # defensive: some clang-cl versions derive the implib from /Fe
          [ -f artifact/lib/krita_bridge_real.lib ] || cp artifact/bin/krita_bridge_real.lib artifact/lib/ 2>/dev/null || true
          # ---- smoke exe (links the bridge import lib, exercises the full closure)
          clang-cl /nologo /std:c++17 /EHsc /O2 /MD \
            "$WS/bridge/smoke_test_real.cpp" \
            /Fe:artifact/bin/smoke_test_real.exe \
            /link /LIBPATH:artifact/lib krita_bridge_real.lib
          echo '=== Running REAL-engine smoke test on Windows (merged MSVC engine) ==='
          export PATH="$GITHUB_WORKSPACE/artifact/bin:$QT/bin:$KF5/bin:$VP/bin:$PATH"
          echo '=== loader audit: unresolved DLL imports ==='
          ldd artifact/bin/krita_bridge_real.dll 2>&1 | grep -i 'not found' || echo 'OK: no missing imports for bridge dll'
          ldd artifact/bin/smoke_test_real.exe 2>&1 | grep -i 'not found' || echo 'OK: no missing imports for smoke exe'
          echo '=== run smoke ==='
          ./artifact/bin/smoke_test_real.exe

      - name: Save dependency caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            C:/vcpkg2/installed
            C:/kf5
            C:/kf5-src
            C:/kf5-build
          key: winengine-deps-v10

      - name: Save krita build tree cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/build
          key: winengine-krbuild-v3

      - name: Upload Windows brush engine
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krita-brush-engine-windows
          path: artifact/
          retention-days: 90

      - name: Windows Summary
        if: always()
        run: |
          echo "## Real Krita Brush Engine (Windows/MSVC, merged single-DLL)" >> $GITHUB_STEP_SUMMARY
          echo "Source: real Krita v6.0.4 (unmodified, from krita-source/)" >> $GITHUB_STEP_SUMMARY
          if [ -f artifact/bin/krita_bridge_real.dll ] && [ -f artifact/bin/smoke_test_real.exe ]; then
            echo "### SUCCESS — merged krita_bridge_real.dll (engine+bridge in one image, MSVC x64)" >> $GITHUB_STEP_SUMMARY
            ls -lh artifact/bin/ artifact/lib/ >> $GITHUB_STEP_SUMMARY
          else
            echo "### FAILED — no bridge/engine DLLs produced" >> $GITHUB_STEP_SUMMARY
          fi

  # ---------------------------------------------------------------------
  # Android (NDK) cross-build of the SAME real engine, loop-36 (roadmap c).
  # Unmodified krita-source -> object closure via NDK clang (per-ABI),
  # thin krita_bridge_real.cpp glue merged into ONE libkrita_bridge.so,
  # export gates. Dependencies: Qt 5.15.2 android (aqtinstall, universal
  # package covers all ABIs), KF5 v5.116.0 cross-built from official KDE
  # sources with NDK toolchain (host tools from a native /opt/kf5-host
  # build), vcpkg android triplets for the C deps (static linkage).
  # Bring-up: x86_64 first (emulator-testable), arm64-v8a next — the
  # matrix axis is the only difference. Krita source is NEVER modified —
  # dependency provisioning + workflow tooling only.
  # ---------------------------------------------------------------------
  build-android-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        abi: [x86_64]        # bring-up ABI; add arm64-v8a once green
    env:
      QTDIR: /opt/Qt/5.15.2/android
      KF5DIR: /opt/kf5-android
      KF5HOST: /opt/kf5-host
      KFTAG: v5.116.0
      ANDROID_API: '24'
      VPROOT: /opt/vcpkg-android
    steps:
      - uses: actions/checkout@v4

      - name: Resolve NDK + ABI mapping
        run: |
          NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -1)
          test -n "$NDK" || { echo 'FATAL: no NDK on runner'; exit 1; }
          echo "NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          case '${{ matrix.abi }}' in
            x86_64)    TRIP=x86_64;  VPT=x64-android ;;
            arm64-v8a) TRIP=aarch64; VPT=arm64-android ;;
            *) echo "FATAL: unsupported abi ${{ matrix.abi }}"; exit 1 ;;
          esac
          echo "ABI_TRIPLE=${TRIP}-linux-android${ANDROID_API}" >> "$GITHUB_ENV"
          echo "VPT_TRIPLET=${VPT}" >> "$GITHUB_ENV"
          echo "NDK=$NDK abi=${{ matrix.abi }} triplet=${TRIP}-linux-android${ANDROID_API} vcpkg=${VPT}"

      - name: Restore dependency caches (KF5-android + vcpkg installed)
        uses: actions/cache/restore@v4
        with:
          path: |
            /opt/kf5-android
            /opt/kf5-host
            /opt/kf5-src
            /opt/kf5-build
            /opt/vcpkg-android/installed
          key: andengine-deps-v3-${{ matrix.abi }}
          restore-keys: |
            andengine-deps-v3-${{ matrix.abi }}-
            andengine-deps-v2-${{ matrix.abi }}
            andengine-deps-v1-${{ matrix.abi }}

      - name: Restore krita build tree (ninja incremental)
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/build
          key: andengine-krbuild-${{ matrix.abi }}-v1
          restore-keys: andengine-krbuild-${{ matrix.abi }}-

      - name: Clone krita-source (real Krita v6.0.4, unmodified)
        run: |
          for i in 1 2 3 4 5; do
            rm -rf /tmp/krita-repo
            git clone --depth 1 --branch main \
              "https://x-access-token:${{ secrets.KRITA_SOURCE_TOKEN }}@github.com/koenigsegggjesk0o/krita.git" \
              /tmp/krita-repo && break
            echo "kr clone attempt $i failed; retry in 15s"; sleep 15
          done
          test -d /tmp/krita-repo/krita-source || { echo 'FATAL: krita clone failed after retries'; exit 1; }
          cp -r /tmp/krita-repo/krita-source "$GITHUB_WORKSPACE/krita"
          cd "$GITHUB_WORKSPACE/krita"
          echo "=== Real Krita source verified ==="
          grep "KRITA_VERSION_STRING" CMakeLists.txt | head -2

      - name: Clone bridge sources (app repo, feather-krita-flutter)
        run: |
          for i in 1 2 3 4 5; do
            rm -rf /tmp/fkr-app
            git clone --depth 1 --branch feather-krita-flutter \
              "https://x-access-token:${{ secrets.KRITA_SOURCE_TOKEN }}@github.com/koenigsegggjesk0o/krita.git" \
              /tmp/fkr-app && break
            echo "bridge clone attempt $i failed; retry in 15s"; sleep 15
          done
          test -d /tmp/fkr-app/native/krita_bridge || { echo 'FATAL: bridge clone failed after retries'; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/bridge"
          cp /tmp/fkr-app/native/krita_bridge/krita_bridge.h        "$GITHUB_WORKSPACE/bridge/"
          cp /tmp/fkr-app/native/krita_bridge/krita_bridge_real.cpp "$GITHUB_WORKSPACE/bridge/"
          cp /tmp/fkr-app/native/krita_bridge/smoke_test_real.cpp   "$GITHUB_WORKSPACE/bridge/"
          ls -la "$GITHUB_WORKSPACE/bridge/"

      - name: Install host deps + Qt 5.15.2 (android universal) via aqtinstall
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config gettext nasm qtbase5-dev qttools5-dev-tools qttools5-dev qtdeclarative5-dev
          python -m pip install --quiet aqtinstall
          for i in 1 2 3; do
            rm -rf /opt/Qt
            aqt install-qt linux android 5.15.2 android -O /opt/Qt \
              --archives qtbase qtdeclarative qttools qtsvg qttranslations icu qtandroidextras && break
            echo "aqt attempt $i failed; retrying in 15s"; sleep 15
          done
          test -f "$QTDIR/bin/qmake" || { echo 'FATAL: android qmake missing'; exit 1; }
          ls "$QTDIR/lib" | grep "Qt5Core_${{ matrix.abi }}.so" || { echo "FATAL: Qt5Core_${{ matrix.abi }}.so missing"; exit 1; }
          echo "Qt android installed: $QTDIR"

      - name: Bootstrap vcpkg (android triplets, static linkage)
        run: |
          if [ ! -x "$VPROOT/vcpkg" ]; then
            rm -rf "$VPROOT-tmp"
            git clone --depth 1 --branch 2025.06.13 https://github.com/microsoft/vcpkg.git "$VPROOT-tmp"
            mkdir -p "$VPROOT"
            cp -a "$VPROOT-tmp/." "$VPROOT/"
            rm -rf "$VPROOT-tmp"
            "$VPROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi
          test -x "$VPROOT/vcpkg" || { echo 'FATAL: vcpkg bootstrap failed'; exit 1; }
          echo 'vcpkg bootstrapped'

      - name: vcpkg engine deps (static, android triplet)
        run: |
          export ANDROID_NDK_HOME="$NDK_ROOT"
          "$VPROOT/vcpkg" install --triplet "$VPT_TRIPLET" \
            zlib bzip2 lcms zstd tiff fontconfig eigen3 exiv2 fribidi freetype harfbuzz libunibreak \
            'ffmpeg[core,avcodec,avfilter,avformat,swscale]' \
            boost-multi-array boost-icl boost-rational boost-utility boost-integer \
            boost-accumulators boost-circular-buffer boost-heap boost-math \
            boost-intrusive boost-polygon boost-geometry boost-graph \
            boost-property-tree boost-random boost-format boost-function gsl
          test -d "$VPROOT/installed/$VPT_TRIPLET/lib" || { echo 'FATAL: vcpkg install failed'; exit 1; }

      - name: ECM (host build, arch-independent install into cross prefix)
        run: |
          mkdir -p /opt/kf5-src /opt/kf5-build
          [ -d /opt/kf5-src/ECM ] || for i in 1 2 3 4 5; do
            git clone --depth 1 --branch "$KFTAG" https://invent.kde.org/frameworks/extra-cmake-modules.git /opt/kf5-src/ECM && break
            echo "clone ECM attempt $i failed; retry in 15s"; rm -rf /opt/kf5-src/ECM; sleep 15
          done
          test -d /opt/kf5-src/ECM || { echo 'FATAL: clone ECM failed after retries'; exit 1; }
          cmake -S /opt/kf5-src/ECM -B /opt/kf5-build/build-ecm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$KF5DIR" -DBUILD_TESTING=OFF
          cmake --build /opt/kf5-build/build-ecm
          cmake --install /opt/kf5-build/build-ecm
          test -f "$KF5DIR/share/ECM/cmake/ECMConfig.cmake" || { echo 'FATAL: ECM not installed'; exit 1; }

      - name: Host tools (kconfig_compiler + desktoptojson, native)
        run: |
          # Cross builds of kconfig/kcoreaddons invoke code generators at
          # BUILD time — they must be native binaries. Build the two
          # frameworks natively first and expose their bin/ on PATH.
          export PATH="$KF5HOST/bin:$PATH"
          for fw in kcoreaddons kconfig; do
            echo "=== host framework: $fw ==="
            [ -d "/opt/kf5-src/host-$fw" ] || for i in 1 2 3 4 5; do
              git clone --depth 1 --branch "$KFTAG" "https://invent.kde.org/frameworks/$fw.git" "/opt/kf5-src/host-$fw" && break
              echo "clone host-$fw attempt $i failed; retry in 15s"; rm -rf "/opt/kf5-src/host-$fw"; sleep 15
            done
            test -d "/opt/kf5-src/host-$fw" || { echo "FATAL: clone host-$fw failed after retries"; exit 1; }
            cmake -S "/opt/kf5-src/host-$fw" -B "/opt/kf5-build/host-$fw" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$KF5HOST" \
              -DCMAKE_PREFIX_PATH="$KF5DIR;$KF5HOST" \
              -DBUILD_TESTING=OFF -DBUILD_HTML_DOCS=OFF -DBUILD_QTHELP_DOCS=OFF -DBUILD_DESIGNERPLUGIN=OFF
            cmake --build "/opt/kf5-build/host-$fw" --parallel
            cmake --install "/opt/kf5-build/host-$fw"
          done
          test -x "$KF5HOST/lib/x86_64-linux-gnu/libexec/kf5/kconfig_compiler_kf5" || test -x "$KF5HOST/bin/kconfig_compiler" || { echo 'FATAL: host kconfig_compiler missing'; ls "$KF5HOST/bin"; find "$KF5HOST" -name '*kconfig_compiler*'; exit 1; }
          ls "$KF5HOST/bin" | head -20

      - name: Cross-build KF5 frameworks (engine closure set, NDK toolchain)
        run: |
          export PATH="$KF5HOST/bin:$VPROOT/installed/$VPT_TRIPLET/tools/gettext/bin:$PATH"
          VPTC="$VPROOT/scripts/buildsystems/vcpkg.cmake"
          PREFIX="$QTDIR;$KF5DIR;$VPROOT/installed/$VPT_TRIPLET"
          # ---- minimal libintl shim for android (workflow provisioning).
          # GNU gettext's libintl.a has hard bionic gaps (iconv, nl_langinfo,
          # fgets_unlocked at API 24) and libintl-lite is not fetchable
          # anonymously. Krita ships NO translation catalogs, so a pass-through
          # intl (every lookup returns the msgid = source string) is
          # semantically identical to our Linux/Windows engine builds.
          mkdir -p "$KF5DIR/include" "$KF5DIR/lib"
          python3 - << 'PYEOF'
          import os
          kf5 = os.environ['KF5DIR']
          hdr = r"""
          #ifndef KRITA_INTL_SHIM_H
          #define KRITA_INTL_SHIM_H
          #ifdef __cplusplus
          extern "C" {
          #endif
          char *gettext(const char *msgid);
          char *dgettext(const char *domain, const char *msgid);
          char *dcgettext(const char *domain, const char *msgid, int category);
          char *ngettext(const char *msgid1, const char *msgid2, unsigned long n);
          char *dngettext(const char *domain, const char *msgid1, const char *msgid2, unsigned long n);
          char *dcngettext(const char *domain, const char *msgid1, const char *msgid2, unsigned long n, int category);
          char *textdomain(const char *domain);
          char *bindtextdomain(const char *domain, const char *dir);
          char *bind_textdomain_codeset(const char *domain, const char *codeset);
          #ifdef __cplusplus
          }
          #endif
          #endif
          """
          src = r"""
          #include <stddef.h>
          static const char *shim_domain = "messages";
          char *gettext(const char *msgid) { return (char *)msgid; }
          char *dgettext(const char *d, const char *m) { (void)d; return (char *)m; }
          char *dcgettext(const char *d, const char *m, int c) { (void)d; (void)c; return (char *)m; }
          char *ngettext(const char *m1, const char *m2, unsigned long n) { return (char *)(n == 1 ? m1 : m2); }
          char *dngettext(const char *d, const char *m1, const char *m2, unsigned long n) { (void)d; return (char *)(n == 1 ? m1 : m2); }
          char *dcngettext(const char *d, const char *m1, const char *m2, unsigned long n, int c) { (void)d; (void)c; return (char *)(n == 1 ? m1 : m2); }
          char *textdomain(const char *d) { if (d) shim_domain = d; return (char *)shim_domain; }
          char *bindtextdomain(const char *d, const char *dir) { (void)d; (void)dir; return (char *)""; }
          char *bind_textdomain_codeset(const char *d, const char *cs) { (void)d; (void)cs; return 0; }
          """
          open(kf5 + '/include/libintl.h', 'w').write(hdr)
          open('/opt/intl_shim.c', 'w').write(src)
          PYEOF
          TC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$TC/$ABI_TRIPLE-clang" -c /opt/intl_shim.c -O2 -fPIC -o /opt/intl_shim.o
          "$TC/llvm-ar" rcs "$KF5DIR/lib/libintl.a" /opt/intl_shim.o
          ls -la "$KF5DIR/lib/libintl.a" "$KF5DIR/include/libintl.h"
          for fw in kcoreaddons karchive kconfig ki18n kguiaddons kwidgetsaddons kcompletion kitemviews; do
            echo "=== cross framework: $fw (${{ matrix.abi }}) ==="
            [ -d "/opt/kf5-src/KF5-$fw" ] || for i in 1 2 3 4 5; do
              git clone --depth 1 --branch "$KFTAG" "https://invent.kde.org/frameworks/$fw.git" "/opt/kf5-src/KF5-$fw" && break
              echo "clone $fw attempt $i failed; retry in 15s"; rm -rf "/opt/kf5-src/KF5-$fw"; sleep 15
            done
            test -d "/opt/kf5-src/KF5-$fw" || { echo "FATAL: clone $fw failed after retries"; exit 1; }
            # ki18n v5.116 has a latent Qt5-android compile bug: the
            # assets:-catalog path calls loadMessageCatalogFile which no
            # upstream source file defines (libintl-lite era leftover). We
            # ship no translations, so neutralize that dead path with a
            # forced-include stub — toolchain-level fix, NO source edits.
            FW_CXX_FLAGS=""
            FW_SHARED_LINK_FLAGS=""
            if [ "$fw" = "ki18n" ]; then
              {
                echo '#pragma once'
                echo 'template <typename... A>'
                echo 'static inline void ki18n_stub_load(A &&...) {}'
                echo '#define loadMessageCatalogFile(...) ki18n_stub_load(__VA_ARGS__)'
              } > /opt/ki18n_android_stub.h
              FW_CXX_FLAGS="-include /opt/ki18n_android_stub.h"
              FW_SHARED_LINK_FLAGS="-landroid -llog"
            fi
            cmake -S "/opt/kf5-src/KF5-$fw" -B "/opt/kf5-build/and-$fw" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$KF5DIR" \
              -DCMAKE_PREFIX_PATH="$PREFIX" \
              -DCMAKE_FIND_ROOT_PATH="$QTDIR;$KF5DIR;$VPROOT/installed/$VPT_TRIPLET" \
              -DCMAKE_PROGRAM_PATH="$KF5HOST/bin" \
              -DKF5_HOST_TOOLING="$KF5HOST/lib/x86_64-linux-gnu/cmake" \
              -DCMAKE_CXX_FLAGS="$FW_CXX_FLAGS" \
              -DCMAKE_SHARED_LINKER_FLAGS="$FW_SHARED_LINK_FLAGS" \
              -DCMAKE_TOOLCHAIN_FILE="$VPTC" \
              -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$NDK_ROOT/build/cmake/android.toolchain.cmake" \
              -DVCPKG_TARGET_TRIPLET="$VPT_TRIPLET" \
              -DANDROID_ABI='${{ matrix.abi }}' -DANDROID_PLATFORM="android-$ANDROID_API" \
              -DANDROID_STL=c++_shared \
              -DBUILD_TESTING=OFF -DBUILD_HTML_DOCS=OFF -DBUILD_QTHELP_DOCS=OFF -DBUILD_DESIGNERPLUGIN=OFF \
              -DKF_IGNORE_PLATFORM_CHECK=TRUE
            cmake --build "/opt/kf5-build/and-$fw" --parallel
            cmake --install "/opt/kf5-build/and-$fw"
          done
          test -f "$KF5DIR/lib/cmake/KF5I18n/KF5I18nConfig.cmake" || { echo 'FATAL: KF5I18n not installed'; exit 1; }

      - name: Install immer + zug + xsimd + lager (header-only, host install)
        run: |
          mkdir -p /opt/kf5-src /opt/kf5-build
          [ -d /opt/kf5-src/immer ] || git clone --depth 1 https://github.com/arximboldi/immer.git /opt/kf5-src/immer
          cmake -S /opt/kf5-src/immer -B /opt/kf5-build/build-immer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$KF5DIR" -DBUILD_TESTING=OFF -Dimmer_BUILD_TESTS=OFF -Dimmer_BUILD_PERSIST_TESTS=OFF -Dimmer_BUILD_EXAMPLES=OFF -Dimmer_BUILD_DOCS=OFF -Dimmer_BUILD_EXTRAS=OFF -Dimmer_BUILD_BENCHMARKS=OFF
          cmake --build /opt/kf5-build/build-immer && cmake --install /opt/kf5-build/build-immer
          [ -d /opt/kf5-src/zug ] || git clone --depth 1 https://github.com/arximboldi/zug.git /opt/kf5-src/zug
          cmake -S /opt/kf5-src/zug -B /opt/kf5-build/build-zug -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$KF5DIR" -DBUILD_TESTING=OFF -Dzug_BUILD_TESTS=OFF -Dzug_BUILD_EXAMPLES=OFF -Dzug_BUILD_DOCS=OFF
          cmake --build /opt/kf5-build/build-zug && cmake --install /opt/kf5-build/build-zug
          [ -d /opt/kf5-src/xsimd ] || git clone --depth 1 --branch 13.0.0 https://github.com/xtensor-stack/xsimd.git /opt/kf5-src/xsimd
          cmake -S /opt/kf5-src/xsimd -B /opt/kf5-build/build-xsimd -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$KF5DIR" -DBUILD_TESTING=OFF -DBUILD_TESTS=OFF
          cmake --build /opt/kf5-build/build-xsimd && cmake --install /opt/kf5-build/build-xsimd
          [ -d /opt/kf5-src/lager ] || git clone --depth 1 https://github.com/arximboldi/lager.git /opt/kf5-src/lager
          cmake -S /opt/kf5-src/lager -B /opt/kf5-build/build-lager -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$KF5DIR" -DBUILD_TESTING=OFF -Dlager_BUILD_TESTS=OFF -Dlager_BUILD_FAILURE_TESTS=OFF -Dlager_BUILD_EXAMPLES=OFF -Dlager_BUILD_DEBUGGER_EXAMPLES=OFF -Dlager_BUILD_DOCS=OFF -Dlager_EMBED_RESOURCES_PATH=OFF
          cmake --build /opt/kf5-build/build-lager && cmake --install /opt/kf5-build/build-lager

      - name: Cross-build QuaZip v1.4 (Qt5Core-only, NDK)
        run: |
          [ -d /opt/kf5-src/quazip ] || for i in 1 2 3 4 5; do
            git clone --depth 1 --branch v1.4 https://github.com/stachenov/quazip.git /opt/kf5-src/quazip && break
            echo "clone quazip attempt $i failed; retry in 15s"; rm -rf /opt/kf5-src/quazip; sleep 15
          done
          test -d /opt/kf5-src/quazip || { echo 'FATAL: clone quazip failed after retries'; exit 1; }
          cmake -S /opt/kf5-src/quazip -B /opt/kf5-build/and-quazip -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$KF5DIR" \
            -DCMAKE_PREFIX_PATH="$QTDIR;$KF5DIR;$VPROOT/installed/$VPT_TRIPLET" \
            -DCMAKE_FIND_ROOT_PATH="$QTDIR;$KF5DIR;$VPROOT/installed/$VPT_TRIPLET" \
            -DCMAKE_TOOLCHAIN_FILE="$VPROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DVCPKG_TARGET_TRIPLET="$VPT_TRIPLET" \
            -DANDROID_ABI='${{ matrix.abi }}' -DANDROID_PLATFORM="android-$ANDROID_API" \
            -DANDROID_STL=c++_shared \
            -DQUAZIP_QT_MAJOR_VERSION=5 -DBUILD_TESTING=OFF -DQUAZIP_BUILD_TESTS=OFF
          cmake --build /opt/kf5-build/and-quazip && cmake --install /opt/kf5-build/and-quazip
          test -n "$(find "$KF5DIR" -name 'QuaZip-Qt5*Config.cmake' | head -1)" || { echo 'FATAL: QuaZip-Qt5 config not installed'; exit 1; }

      - name: Provide android deps (unwindstack header-only stub + find module)
        run: |
          # Krita's android path requires find_package(unwindstack) — upstream
          # resolves it from KDE's android deps bundle (AOSP libunwindstack).
          # The android crash backtrace is NOT an engine feature; provide a
          # header-only no-op of the exact API surface krita uses, so the
          # merged engine .so carries no unwindstack link-time symbols at all.
          # Plus a Findunwindstack.cmake module setting the variables krita's
          # CMakeLists reads. Workflow provisioning — krita source untouched.
          mkdir -p /opt/android_deps/include/unwindstack /opt/android_deps/cmake
          python3 - << 'PYEOF'
          import os
          inc = '/opt/android_deps/include/unwindstack'
          regsh = r'''
          #pragma once
          #include <cstdint>
          #include <sys/types.h>
          namespace unwindstack {
          enum class Arch { UNKNOWN = 0 };
          class Regs {
          public:
            virtual ~Regs() = default;
            static Arch CurrentArch() { return Arch::UNKNOWN; }
            static Regs *CreateFromLocal() { return new Regs(); }
            static Regs *CreateFromUcontext(Arch, void *) { return new Regs(); }
          };
          }  // namespace unwindstack
          '''
          unwinderh = r'''
          #pragma once
          #include <string>
          #include <vector>
          #include "Regs.h"
          namespace unwindstack {
          struct FrameData {
            uint64_t pc = 0;
            uint64_t sp = 0;
            std::string function_name;
            uint64_t function_offset = 0;
            std::string map_name;
          };
          class UnwinderFromPid {
          public:
            UnwinderFromPid(size_t, pid_t, Arch) {}
            bool Init() { return false; }
            const char *LastErrorCodeString() { return "unwindstack stub (android crash backtrace not an engine feature)"; }
            int LastErrorCode() { return 0; }
            void SetRegs(Regs *) {}
            void Unwind() {}
            std::vector<FrameData> &frames() { return frames_; }
            std::string FormatFrame(const FrameData &) { return std::string(); }
          private:
            std::vector<FrameData> frames_;
          };
          }  // namespace unwindstack
          '''
          open(inc + '/Regs.h', 'w').write(regsh)
          open(inc + '/Unwinder.h', 'w').write(unwinderh)
          fmod = r'''
          # Findunwindstack.cmake — workflow provisioning for krita's android
          # configure path. unwindstack is header-only (no-op stub): no libs.
          if(NOT unwindstack_FIND_QUIETLY)
            message(STATUS "unwindstack: workflow stub (header-only, no-op)")
          endif()
          set(unwindstack_INCLUDE_DIR /opt/android_deps/include)
          set(unwindstack_LIBRARIES "")
          include(FindPackageHandleStandardArgs)
          find_package_handle_standard_args(unwindstack DEFAULT_MSG unwindstack_INCLUDE_DIR)
          '''
          os.makedirs('/opt/android_deps/cmake', exist_ok=True)
          open('/opt/android_deps/cmake/Findunwindstack.cmake', 'w').write(fmod)
          PYEOF
          ls -la /opt/android_deps/include/unwindstack/ /opt/android_deps/cmake/
          test -f /opt/android_deps/include/unwindstack/Regs.h || { echo 'FATAL: unwindstack stub missing'; exit 1; }
          # ---- krita's ANDROID STL check expects the OLD ECM sysroot layout
          # (sysroot/usr/lib/<arch>/libc++_shared.so). NDK r29 uses full
          # triples. Create arch-alias symlinks INSIDE the NDK (toolchain
          # provisioning, krita untouched) so the EXISTS check passes.
          NDKLIB="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib"
          test -f "$NDKLIB/$ABI_TRIPLE/libc++_shared.so" || { echo "FATAL: NDK libc++_shared missing at $NDKLIB/$ABI_TRIPLE"; exit 1; }
          for ARCH in x86_64 aarch64 arm64-v8a armeabi-v7a; do
            sudo mkdir -p "$NDKLIB/$ARCH"
            sudo ln -sf "$NDKLIB/$ABI_TRIPLE/libc++_shared.so" "$NDKLIB/$ARCH/libc++_shared.so"
          done
          echo "NDK sysroot STL aliases created:"
          ls -la "$NDKLIB/x86_64/"

      - name: Configure Krita (minimal engine build, Qt5 android, unmodified source)
        run: |
          VPTC="$VPROOT/scripts/buildsystems/vcpkg.cmake"
          # krita's ANDROID branch uses pkg_check_modules(LibAV REQUIRED) with
          # the HOST pkg-config — point it at the android triplet's .pc files
          # (cross compile: nothing is executed, only link/include paths read)
          export PKG_CONFIG_PATH="$VPROOT/installed/$VPT_TRIPLET/lib/pkgconfig:$VPROOT/installed/$VPT_TRIPLET/share/pkgconfig"
          rm -f "$GITHUB_WORKSPACE/build/CMakeCache.txt"
          # EMPTY krita export macros: no dllexport/visibility special-casing
          # anywhere; the merged .so exports the extern "C" bridge ABI via
          # KRITA_BRIDGE_API in krita_bridge.h (same design as Windows).
          EMPTY_EXPORTS="-DKRITAGLOBAL_EXPORT= -DKRITAIMAGE_EXPORT= -DKRITAPIGMENT_EXPORT= -DKRITARESOURCES_EXPORT= -DKRITASTORE_EXPORT= -DKRITAPSDUTILS_EXPORT= -DKRITAMETADATA_EXPORT= -DKRITACOMMAND_EXPORT= -DKRITAMULTIARCH_EXPORT= -DKRITAVERSION_EXPORT= -DBRUSH_EXPORT= -DKRITAPLUGIN_EXPORT= -DKRITAWIDGETS_EXPORT= -DKRITAWIDGETUTILS_EXPORT= -DKRITAFLAKE_EXPORT= -DKRITACOMMON_EXPORT= -DKRITARESOURCEWIDGETS_EXPORT="
          cmake -S "$GITHUB_WORKSPACE/krita" -B "$GITHUB_WORKSPACE/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="$EMPTY_EXPORTS" \
            -DBUILD_TESTING=OFF -DENABLE_PYTHON=OFF \
            -DWITH_QT6=OFF \
            -DWITH_HEIF=OFF -DWITH_JPEG=OFF -DWITH_PNG=OFF -DWITH_TIFF=OFF \
            -DWITH_RAW=OFF -DWITH_GIF=OFF -DWITH_FFTW3=OFF -DWITH_OPENEXR=OFF \
            -DWITH_KDE=ON -DWITH_XCF=OFF -DWITH_SOPRANO=OFF -DWITH_HDR=OFF \
            -DWITH_WEBP=OFF -DWITH_JXL=OFF -DWITH_OCIO=OFF \
            -DWITH_OPENJPEG=OFF -DWITH_MEDIA=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_LibMyPaint=TRUE \
            -DCMAKE_PROGRAM_PATH="$KF5HOST/bin" \
            -DKF5_HOST_TOOLING="$KF5HOST/lib/x86_64-linux-gnu/cmake" \
            -DGETTEXT_MSGFMT_EXECUTABLE=/usr/bin/msgfmt \
            -DGETTEXT_MSGMERGE_EXECUTABLE=/usr/bin/msgmerge \
            -DCMAKE_PREFIX_PATH="$QTDIR;$KF5DIR;$VPROOT/installed/$VPT_TRIPLET" \
            -DCMAKE_FIND_ROOT_PATH="$QTDIR;$KF5DIR;$VPROOT/installed/$VPT_TRIPLET" \
            -DCMAKE_MODULE_PATH="/opt/android_deps/cmake" \
            -DANDROID_SDK_ROOT=/usr/local/lib/android/sdk \
            -DCMAKE_TOOLCHAIN_FILE="$VPTC" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DVCPKG_TARGET_TRIPLET="$VPT_TRIPLET" \
            -DANDROID_ABI='${{ matrix.abi }}' -DANDROID_PLATFORM="android-$ANDROID_API" \
            -DANDROID_STL=c++_shared 2>&1 | tail -100
          grep -m2 'CMAKE_PREFIX_PATH\|ANDROID' "$GITHUB_WORKSPACE/build/CMakeCache.txt" || echo 'DIAG: no cache entries matched'

      - name: Prune per-lib .so link edges from build.ninja (objects are the deliverable)
        run: |
          cd "$GITHUB_WORKSPACE/build"
          python - << 'PYEOF'
          import re
          data = open('build.ninja','rb').read().decode('utf-8', 'replace')
          SO = re.compile(r'\.so(\.[0-9.]+)?$')
          def is_lib_tok(t):
              return bool(SO.search(t)) or t.endswith('.a')
          blocks = data.split('\n\n')
          kept = []
          dropped = 0
          for b in blocks:
              if not b.strip():
                  continue
              lines = b.split('\n')
              first = lines[0]
              if first.startswith('build '):
                  outputs = first.split(':', 1)[0].split()
                  if any(is_lib_tok(o) for o in outputs):
                      dropped += 1
                      continue
              nb = []
              for l in lines:
                  toks = [t for t in l.split(' ') if not is_lib_tok(t)]
                  nb.append(' '.join(toks))
              kept.append('\n'.join(nb))
          open('build.ninja','w').write('\n\n'.join(kept) + '\n')
          print('dropped link edges:', dropped, '| kept blocks:', len(kept))
          bad = [l for l in open('build.ninja').read().split('\n')
                 if l.startswith('build ') and any(is_lib_tok(t) for t in l.split(' '))]
          print('lines still referencing lib outputs:', len(bad))
          for l in bad[:5]: print('  BAD:', l[:120])
          if bad:
              raise SystemExit(3)
          PYEOF
          test "$?" -eq 0 || { echo 'FATAL: build.ninja surgery failed'; exit 1; }

      - name: Build brush engine OBJECTS (engine closure, NDK)
        run: |
          cd "$GITHUB_WORKSPACE/build"
          # Same explicit-object design as the Windows job (loop-35): build
          # the closure's object outputs directly; the merged-.so link step
          # consumes them. -k 0 so one bad TU doesn't block the rest.
          OBJS=$(ninja -t targets all | grep -E '\.o:' \
            | grep -E 'CMakeFiles.(kritaimage|kritalibbrush|kritapigment|kritaresources|kritastore|kritaglobal|kritawidgets|kritawidgetutils|kritaflake|kritapsdutils|kritametadata|kritacommand|kritamultiarch|kritaversion|kritaplugin|kritaresourcewidgets|libraqm)(_autogen)?\.dir' \
            | cut -d: -f1)
          NOBJS_PLAN=$(printf '%s\n' "$OBJS" | wc -l)
          echo "objects planned: $NOBJS_PLAN"
          [ "$NOBJS_PLAN" -gt 700 ] || { echo 'FATAL: object plan too small - filter mismatch?'; printf '%s\n' "$OBJS" | head -5; exit 1; }
          printf '%s\n' "$OBJS" | xargs -n 80 ninja -k 0 2>&1 | tail -40 || true
          NOBJS=$(find . -name '*.o' | wc -l)
          echo "krita objects built: $NOBJS"
          [ "$NOBJS" -gt 700 ] || { echo 'FATAL: too few objects built (compile errors?)'; exit 1; }
          [ -n "$(find . -name 'kis_auto_brush.cpp.o' | head -1)" ] || { echo 'FATAL: kis_auto_brush.cpp.o missing'; exit 1; }
          [ -n "$(find . -name 'KoXmlNS.cpp.o' | head -1)" ] || { echo 'FATAL: KoXmlNS.cpp.o missing'; exit 1; }
          [ -n "$(find . -path '*CMakeFiles/libraqm.dir*' -name 'raqm.c.o' | head -1)" ] || { echo 'FATAL: vendored raqm.c.o missing'; exit 1; }
          echo 'object gates OK'

      - name: Merge real-engine .so (all krita objects + bridge glue) + export gates
        run: |
          WS="$GITHUB_WORKSPACE"
          BUILD="$WS/build"
          QT="$QTDIR"
          KF5="$KF5DIR"
          VP="$VPROOT/installed/$VPT_TRIPLET"
          TC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p artifact/lib
          # ---- include dirs: reuse the exact flags CMake configured for kritalibbrush
          BRUSHREL=$(cd "$BUILD" && find libs -name 'KisBrushModel.cpp.o' | head -1)
          [ -z "$BRUSHREL" ] && BRUSHREL=$(cd "$BUILD" && find libs -name 'kis_auto_brush.cpp.o' | head -1)
          [ -n "$BRUSHREL" ] || { echo 'FATAL: brush obj not found for include extraction'; exit 1; }
          LINE=$(cd "$BUILD" && ninja -t commands "$BRUSHREL" | tail -1 || true)
          [ -n "$LINE" ] || { echo 'FATAL: no compile command found for' "$BRUSHREL"; exit 1; }
          INCS=$(printf '%s' "$LINE" | grep -oE '(-I"[^"]+"|-I[^ ]+)' | sed -E 's#^-I"?([^"]+)"?$#\1#' | sort -u | head -200 | sed 's#^#-I#' | tr '\n' ' ')
          echo "extracted include dirs: $(printf '%s' "$INCS" | wc -w)"
          LIBD=$(find "$WS/krita/libs" -maxdepth 2 -type d | sed 's#^#-I#' | tr '\n' ' ')
          GEND=$(find "$BUILD" -name '*.h' -exec dirname {} \; | sort -u | head -80 | sed 's#^#-I#' | tr '\n' ' ')
          QTINC=''; KFINC=''
          for d in "$QT/include"/Qt*; do [ -d "$d" ] && QTINC="$QTINC -I$d"; done
          for d in "$KF5/include/KF5"/*/; do [ -d "$d" ] && KFINC="$KFINC -I$d"; done
          INCS="$INCS $LIBD $GEND -I$WS/krita -I$BUILD $QTINC $KFINC -I$VP/include"
          echo "total include dirs: $(printf '%s' "$INCS" | wc -w)"
          # ---- closure objects
          find "$BUILD/libs" "$BUILD/3rdparty_vendor" -name '*.o' \
            | grep -E 'CMakeFiles.(kritaimage|kritalibbrush|kritapigment|kritaresources|kritastore|kritaglobal|kritawidgets|kritawidgetutils|kritaflake|kritapsdutils|kritametadata|kritacommand|kritamultiarch|kritaversion|kritaplugin|kritaresourcewidgets|libraqm)(_autogen)?\.dir' \
            | sort > "$BUILD/krita_objs.rsp"
          NOBJS=$(wc -l < "$BUILD/krita_objs.rsp")
          echo "merging $NOBJS krita objects into ONE engine .so"
          # ---- static vcpkg archives: FULL PATHS on the link line
          # (over-link is safe: unused archive members are skipped)
          VPLIBS=$(find "$VP/lib" -maxdepth 1 -name '*.a' | tr '\n' ' ')
          echo "vcpkg static libs: $(echo $VPLIBS | wc -w)"
          # ---- KF5 cross-built shared libs: full paths, over-link safe on ELF
          KFLIBS=$(find "$KF5/lib" -maxdepth 1 -name 'libKF5*.so' | tr '\n' ' ')
          echo "kf5 libs: $(echo $KFLIBS | wc -w)"
          # ---- deterministic STL: Qt5 android libs use libc++_shared.so; the
          # merged engine must use the SAME STL (two libc++ copies in one
          # process = ODR crash). -nostdlib++ suppresses the driver default,
          # then libc++_shared.so is linked explicitly + bundled.
          LIBCXXSHARED="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/$ABI_TRIPLE/libc++_shared.so"
          test -f "$LIBCXXSHARED" || { echo "FATAL: libc++_shared.so not found at $LIBCXXSHARED"; exit 1; }
          CLANG="$TC/$ABI_TRIPLE-clang++"
          $CLANG -std=c++17 -shared -fPIC -O2 -fno-operator-names -nostdlib++ $INCS \
            "$WS/bridge/krita_bridge_real.cpp" \
            @"$BUILD/krita_objs.rsp" \
            -L"$QT/lib" -L"$KF5/lib" -L"$VP/lib" \
            -l"Qt5Core_${{ matrix.abi }}" -l"Qt5Gui_${{ matrix.abi }}" -l"Qt5Xml_${{ matrix.abi }}" \
            -l"Qt5Svg_${{ matrix.abi }}" -l"Qt5Widgets_${{ matrix.abi }}" -l"Qt5Sql_${{ matrix.abi }}" \
            -l"Qt5Concurrent_${{ matrix.abi }}" -l"Qt5Network_${{ matrix.abi }}" \
            $KFLIBS $VPLIBS \
            "$LIBCXXSHARED" -lz -llog \
            -o artifact/lib/libkrita_bridge.so
          # ---- export gate: the extern "C" bridge ABI must be visible
          NM="$TC/llvm-nm"
          NEXP=$("$NM" -D --defined-only artifact/lib/libkrita_bridge.so | grep -c 'krita_bridge' || true)
          echo "exported krita_bridge symbols: $NEXP"
          [ "$NEXP" -ge 5 ] || { echo 'FATAL: bridge ABI exports missing'; exit 1; }
          "$NM" -D --defined-only artifact/lib/libkrita_bridge.so | grep 'krita_bridge' | head -12
          # ---- diagnostics: unresolved symbols triage (NOT a hard gate yet;
          # bionic/log symbols are provided by the OS at dlopen time)
          UNDEF=$("$NM" -D --undefined-only artifact/lib/libkrita_bridge.so | awk '{print $NF}' | sort -u)
          NUNDEF=$(printf '%s\n' "$UNDEF" | wc -l)
          echo "undefined symbol refs: $NUNDEF (resolved at load by Qt/KF5/bionic)"
          printf '%s\n' "$UNDEF" | grep -E 'Ko[A-Z]|Kis[A-Z]|krita_bridge' | head -40 || echo 'OK: no unresolved krita-namespace refs'
          # ---- runtime .so bundle for emulator smoke + APK wiring
          # (Qt + KF5 + icu + libc++_shared, per-ABI where suffixed)
          mkdir -p artifact/android/${{ matrix.abi }}
          cp "$QT/lib"/libQt5*_x86_64.so artifact/android/${{ matrix.abi }}/ 2>/dev/null || true
          cp "$QT/lib"/libQt5*_arm64-v8a.so artifact/android/${{ matrix.abi }}/ 2>/dev/null || true
          cp "$QT/lib"/libicu*.so artifact/android/${{ matrix.abi }}/ 2>/dev/null || true
          cp "$KF5/lib"/libKF5*.so* artifact/android/${{ matrix.abi }}/ 2>/dev/null || true
          cp "$LIBCXXSHARED" artifact/android/${{ matrix.abi }}/ 2>/dev/null || true
          # ---- android smoke executable (links the merged engine .so; run
          # later on an x86_64 emulator via adb for the C++ end-to-end proof)
          $CLANG -std=c++17 -O2 -fPIE -pie $INCS "$WS/bridge/smoke_test_real.cpp" \
            "$WS/artifact/lib/libkrita_bridge.so" \
            -Wl,-rpath,'$ORIGIN' \
            -o artifact/bin/smoke_test_real_android || echo 'WARNING: smoke exe link failed (non-fatal this iteration)'
          ls -lh artifact/lib/ artifact/android/${{ matrix.abi }}/ | head -40

      - name: Save dependency caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            /opt/kf5-android
            /opt/kf5-host
            /opt/kf5-build
            /opt/vcpkg-android/installed
          key: andengine-deps-v3-${{ matrix.abi }}

      - name: Save krita build tree cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/build
          key: andengine-krbuild-${{ matrix.abi }}-v1

      - name: Upload Android brush engine
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krita-brush-engine-android-${{ matrix.abi }}
          path: artifact/
          retention-days: 90

      - name: Android Summary
        if: always()
        run: |
          echo "## Real Krita Brush Engine (Android NDK ${{ matrix.abi }}, merged single-.so)" >> $GITHUB_STEP_SUMMARY
          echo "Source: real Krita v6.0.4 (unmodified, from krita-source/)" >> $GITHUB_STEP_SUMMARY
          if [ -f artifact/lib/libkrita_bridge.so ]; then
            echo "### SUCCESS — merged libkrita_bridge.so (engine+bridge in one image, NDK ${{ matrix.abi }})" >> $GITHUB_STEP_SUMMARY
            ls -lh artifact/lib/ >> $GITHUB_STEP_SUMMARY
          else
            echo "### FAILED — no engine .so produced" >> $GITHUB_STEP_SUMMARY
          fi
